<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05050c">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <title>Circles</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050c; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #fab {
      position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 6;
      background: rgba(8,10,18,0.85); color: #c8ffe8; border: 1px solid rgba(68,255,170,0.45);
      border-radius: 22px; padding: 10px 16px; font: 600 14px system-ui, sans-serif;
      backdrop-filter: blur(8px); cursor: pointer; -webkit-tap-highlight-color: transparent;
      min-width: 96px; text-align: center;
    }
    #scrim {
      display: none; position: fixed; inset: 0; z-index: 4;
      background: rgba(0,0,0,0.45);
    }
    #scrim.open { display: block; }
    #panel {
      position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5; max-height: 52vh; overflow: auto;
      background: rgba(8,10,18,0.94); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 10px 12px 12px;
      font-family: system-ui, sans-serif; color: #d0d6e0;
      display: none; backdrop-filter: blur(10px);
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    #panel.open { display: block; }
    #panel .actions { display: flex; gap: 8px; margin-top: 10px; }
    #panel .actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px 10px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #doneBtn { background: #44ffaa; color: #062218; }
    #reloadBtn { background: rgba(255,255,255,0.1); color: #e8eef8; border: 1px solid rgba(255,255,255,0.15) !important; }
    #ver { text-align: center; color: #667; font-size: 10px; margin-top: 8px; }
    #panel .acc { border-top: 1px solid rgba(255,255,255,0.08); }
    #panel .acc:first-child { border-top: 0; }
    #panel .acc-h {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: transparent; border: 0; color: #7fd4ff; cursor: pointer;
      font: 650 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 12px 4px; -webkit-tap-highlight-color: transparent;
    }
    #panel .acc-h::after { content: '▸'; color: #668; font-size: 12px; }
    #panel .acc.open .acc-h::after { content: '▾'; }
    #panel .acc-b { display: none; padding: 0 2px 8px; }
    #panel .acc.open .acc-b { display: block; }
    #panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    #panel label {
      display: grid; grid-template-columns: 64px 1fr 40px;
      align-items: center; gap: 8px; font-size: 12px; margin: 8px 0;
      min-height: 36px;
    }
    #panel input[type="range"] {
      width: 100%; height: 32px; accent-color: #44ffaa;
      -webkit-appearance: none; appearance: none; background: transparent;
    }
    #panel input[type="range"]::-webkit-slider-runnable-track {
      height: 12px; border-radius: 999px; background: rgba(255,255,255,0.14);
    }
    #panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; margin-top: -8px;
      border-radius: 50%; background: #44ffaa; border: 2px solid #0a1a14;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    #panel input[type="range"]::-moz-range-track {
      height: 12px; border-radius: 999px; background: rgba(255,255,255,0.14);
    }
    #panel input[type="range"]::-moz-range-thumb {
      width: 28px; height: 28px; border-radius: 50%; background: #44ffaa;
      border: 2px solid #0a1a14;
    }
    #panel input[type="checkbox"] { width: 22px; height: 22px; accent-color: #44ffaa; justify-self: start; }
    #panel .val { color: #44ffaa; font-weight: 600; text-align: right; font-size: 12px; }

    #quick {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 3; display: flex; gap: 10px;
      pointer-events: auto;
    }
    #quick button {
      min-width: 88px; padding: 12px 18px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8,10,18,0.78); color: #c8d0dc;
      font: 650 14px system-ui, sans-serif;
      backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent; cursor: pointer;
    }
    #quick button.on {
      color: #062218; background: #44ffaa; border-color: #44ffaa;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 78px; text-align: center; color: #c8d0dc;
      font-family: system-ui, sans-serif; font-size: 13px; text-shadow: 0 1px 8px #000;
      pointer-events: none; opacity: 1; transition: opacity 1.2s ease; padding: 0 20px;
    }

    #qrModal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
      padding: 24px;
    }
    #qrModal.open { display: flex; }
    #qrCard {
      background: #10141e; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 18px 18px 14px; text-align: center;
      max-width: 300px; width: 100%;
      font-family: system-ui, sans-serif; color: #d0d6e0;
    }
    #qrCard img {
      width: 220px; height: 220px; border-radius: 10px; background: #fff;
      display: block; margin: 0 auto 12px;
    }
    #qrUrl {
      font-size: 11px; color: #8ab; word-break: break-all; margin-bottom: 12px; line-height: 1.35;
    }
    #qrCard .qr-actions { display: flex; gap: 8px; }
    #qrCard .qr-actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #qrClose { background: #44ffaa; color: #062218; }
    #qrCopy { background: rgba(255,255,255,0.1); color: #e8eef8; }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="scrim"></div>
  <button id="fab" type="button">Controls</button>
  <div id="quick">
    <button type="button" id="quickFly">Fly</button>
    <button type="button" id="quickFlow" class="on">Flow</button>
  </div>
  <div id="panel">
    <div class="acc open" data-acc>
      <button type="button" class="acc-h">Motion</button>
      <div class="acc-b">
        <label>Circles <input id="count" type="range" min="1" max="108" step="1" value="16"><span class="val" id="countVal">16</span></label>
        <label>Phase <input id="phase" type="range" min="0" max="1" step="0.001" value="0.35"><span class="val" id="phaseVal">0.35</span></label>
        <label>Rate <input id="rate" type="range" min="0.05" max="4" step="0.01" value="1"><span class="val" id="rateVal">1.00×</span></label>
        <label>Twist <input id="twist" type="range" min="0" max="4" step="0.01" value="0"><span class="val" id="twistVal">0.00</span></label>
        <label>Drift <input id="drift" type="range" min="0" max="2" step="0.01" value="0"><span class="val" id="driftVal">0.00</span></label>
        <div class="row">
          <label>Auto flow <input id="autoFlow" type="checkbox" checked><span class="val" id="autoFlowVal">on</span></label>
          <label>Orbit <input id="autoSpin" type="checkbox" checked><span class="val" id="spinVal">on</span></label>
        </div>
        <label>Flow spd <input id="flowSpd" type="range" min="0.15" max="2" step="0.01" value="0.5"><span class="val" id="flowSpdVal">0.50</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Fly</button>
      <div class="acc-b">
        <div class="row">
          <label>Fly <input id="flyMode" type="checkbox"><span class="val" id="flyModeVal">off</span></label>
          <label>Vel by R <input id="flyVel" type="checkbox"><span class="val" id="flyVelVal">off</span></label>
          <label>Inward <input id="flyIn" type="checkbox"><span class="val" id="flyInVal">off</span></label>
          <label>Trails <input id="showTrails" type="checkbox" checked><span class="val" id="trailsVal">on</span></label>
        </div>
        <label>Fly spd <input id="flyAlt" type="range" min="0" max="2" step="0.01" value="0.55"><span class="val" id="flyAltVal">0.55</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Look</button>
      <div class="acc-b">
        <div class="row">
          <label>Glow <input id="glow" type="checkbox" checked><span class="val" id="glowVal">on</span></label>
          <label>Stars <input id="starsOn" type="checkbox" checked><span class="val" id="starsVal">on</span></label>
          <label>Equator <input id="showEq" type="checkbox" checked><span class="val" id="eqVal">on</span></label>
          <label>Dots <input id="showDots" type="checkbox" checked><span class="val" id="dotsVal">on</span></label>
          <label>Fill <input id="fillOn" type="checkbox"><span class="val" id="fillVal">off</span></label>
        </div>
        <label>Width <input id="width" type="range" min="0.4" max="5" step="0.05" value="1.6"><span class="val" id="widthVal">1.60</span></label>
        <label>Hue spd <input id="hueSpd" type="range" min="0" max="80" step="0.5" value="8"><span class="val" id="hueSpdVal">8.0</span></label>
        <label>Ghost <input id="ghost" type="range" min="0" max="0.92" step="0.01" value="0.18"><span class="val" id="ghostVal">0.18</span></label>
        <label>Pulse <input id="pulse" type="range" min="0" max="1" step="0.01" value="0.25"><span class="val" id="pulseVal">0.25</span></label>
      </div>
    </div>
    <div class="actions">
      <button id="shareBtn" type="button" style="background:rgba(127,212,255,0.18);color:#cfefff;border:1px solid rgba(127,212,255,0.35)">Share</button>
      <button id="doneBtn" type="button">Done</button>
      <button id="reloadBtn" type="button">Reload</button>
    </div>
    <div id="ver">v1.3.3 · view lift · normal-integral fly · Share QR · concertina sections · fat sliders · tap jumps flow</div>
  </div>
  
  <div id="qrModal">
    <div id="qrCard">
      <img id="qrImg" width="220" height="220" alt="Share QR">
      <div id="qrUrl"></div>
      <div class="qr-actions">
        <button type="button" id="qrCopy">Copy link</button>
        <button type="button" id="qrClose">Close</button>
      </div>
    </div>
  </div>

  <div id="hint">Flow: one slider wanders · tap canvas to jump slider<br>Pinch zoom · Controls for more</div>
  <script>
    const $ = (id) => document.getElementById(id);
    let N = 16, phase = 0.35, rate = 1, twist = 0, drift = 0;
    let flyMode = false, flyAlt = 0.55, flyIn = false, flyVel = false, showTrails = true;
    let flyBlend = 0; // 0 = on sphere, 1 = full fly (smooth settle)
    let showEq = true, showDots = true, glow = true, fillOn = false, starsOn = true, autoSpin = true;
    let lineW = 1.6, hue0 = 0, hueSpd = 8, pulse = 0.25, ghost = 0.18, fillAmt = 0.06;
    let autoFlow = true, flowSpd = 0.5, paused = false, showNrm = false;

    const APP_VER = '1.3.3';
    const canvas = $('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const panel = $('panel');
    const scrim = $('scrim');
    const fab = $('fab');
    const hint = $('hint');
    const R = 1, CYCLE = 6, MAX_N = 108, TRAIL_LEN = 70;
    const trails = Array.from({ length: MAX_N }, () => []);
    function clearTrails() { for (let i = 0; i < MAX_N; i++) trails[i].length = 0; }

    function setPanel(open) {
      panel.classList.toggle('open', open);
      scrim.classList.toggle('open', open);
      fab.textContent = open ? 'Hide' : 'Controls';
    }
    function closePanel() { setPanel(false); }
    function togglePanel() { setPanel(!panel.classList.contains('open')); }

    fab.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      togglePanel(); hideHint(); keepAwake();
    });
    $('doneBtn').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation(); closePanel();
    });

    function shareUrl() {
      try {
        const u = new URL(location.href);
        u.searchParams.set('v', typeof APP_VER !== 'undefined' ? APP_VER : '1.3.1');
        return u.toString();
      } catch (e) {
        return location.href;
      }
    }
    function openQr() {
      const url = shareUrl();
      const img = $('qrImg');
      const label = $('qrUrl');
      if (label) label.textContent = url;
      if (img) {
        img.alt = 'QR for ' + url;
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=' + encodeURIComponent(url);
      }
      const modal = $('qrModal');
      if (modal) modal.classList.add('open');
    }
    function closeQr() {
      const modal = $('qrModal');
      if (modal) modal.classList.remove('open');
    }
    if ($('shareBtn')) {
      $('shareBtn').addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        closePanel();
        openQr();
      });
    }
    if ($('qrClose')) $('qrClose').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); closeQr(); });
    if ($('qrCopy')) {
      $('qrCopy').addEventListener('click', async e => {
        e.preventDefault(); e.stopPropagation();
        const url = shareUrl();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(url);
          else {
            const ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
          }
          $('qrCopy').textContent = 'Copied';
          setTimeout(() => { $('qrCopy').textContent = 'Copy link'; }, 1200);
        } catch (err) {
          $('qrCopy').textContent = 'Copy failed';
          setTimeout(() => { $('qrCopy').textContent = 'Copy link'; }, 1200);
        }
      });
    }
    if ($('qrModal')) {
      $('qrModal').addEventListener('click', e => {
        if (e.target === $('qrModal')) closeQr();
      });
    }

    $('reloadBtn').addEventListener('click', async e => {
      e.preventDefault(); e.stopPropagation();
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (err) {}
      const u = new URL(location.href);
      u.searchParams.set('v', APP_VER);
      u.searchParams.set('r', String(Date.now()));
      location.replace(u.toString());
    });
    scrim.addEventListener('click', e => { e.preventDefault(); closePanel(); });
    scrim.addEventListener('pointerdown', e => { e.preventDefault(); closePanel(); });
    panel.addEventListener('pointerdown', e => e.stopPropagation());

    document.querySelectorAll('[data-acc] .acc-h').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const acc = btn.closest('[data-acc]');
        const open = !acc.classList.contains('open');
        document.querySelectorAll('[data-acc]').forEach(a => a.classList.remove('open'));
        if (open) acc.classList.add('open');
      });
    });

    function syncQuick() {
      const qf = $('quickFly'), qo = $('quickFlow');
      if (qf) qf.classList.toggle('on', !!flyMode);
      if (qo) qo.classList.toggle('on', !!autoFlow);
    }
    function toggleCheck(id, on) {
      const el = $(id);
      if (!el) return;
      el.checked = on;
      el.dispatchEvent(new Event('change'));
      syncQuick();
    }
    $('quickFly').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      toggleCheck('flyMode', !$('flyMode').checked);
      hideHint(); keepAwake();
    });
    $('quickFlow').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      toggleCheck('autoFlow', !$('autoFlow').checked);
      hideHint(); keepAwake();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=' + APP_VER).catch(() => {});
    }

    let controlsReady = false;
    const bindRange = (id, valId, parse, fmt, apply) => {
      const el = $(id), out = $(valId);
      const go = () => { const v = parse(el.value); out.textContent = fmt(v); apply(v); };
      el.addEventListener('input', go); go();
    };
    const bindCheck = (id, valId, apply) => {
      const el = $(id), out = $(valId);
      const go = () => { apply(el.checked); out.textContent = el.checked ? 'on' : 'off'; };
      el.addEventListener('change', go); go();
    };
    bindRange('count', 'countVal', parseInt, v => v, v => N = v);
    bindRange('phase', 'phaseVal', parseFloat, v => v.toFixed(2), v => phase = v);
    bindRange('rate', 'rateVal', parseFloat, v => v.toFixed(2)+'×', v => rate = v);
    bindRange('twist', 'twistVal', parseFloat, v => v.toFixed(2), v => twist = v);
    bindRange('drift', 'driftVal', parseFloat, v => v.toFixed(2), v => drift = v);
    bindRange('flowSpd', 'flowSpdVal', parseFloat, v => v.toFixed(2), v => flowSpd = v);
    bindCheck('autoFlow', 'autoFlowVal', v => { autoFlow = v; if (v && controlsReady) pickFlowSlider(); syncQuick(); });
    bindCheck('autoSpin', 'spinVal', v => autoSpin = v);
    bindCheck('flyMode', 'flyModeVal', v => { flyMode = v; if (controlsReady) clearTrails(); syncQuick(); });
    bindCheck('flyVel', 'flyVelVal', v => { flyVel = v; if (controlsReady) { rebuildFlyTable(); clearTrails(); } });
    bindCheck('flyIn', 'flyInVal', v => flyIn = v);
    bindCheck('showTrails', 'trailsVal', v => showTrails = v);
    bindRange('flyAlt', 'flyAltVal', parseFloat, v => v.toFixed(2), v => flyAlt = v);
    bindCheck('glow', 'glowVal', v => glow = v);
    bindCheck('starsOn', 'starsVal', v => starsOn = v);
    bindCheck('showEq', 'eqVal', v => showEq = v);
    bindCheck('showDots', 'dotsVal', v => showDots = v);
    bindCheck('fillOn', 'fillVal', v => fillOn = v);
    bindRange('width', 'widthVal', parseFloat, v => v.toFixed(2), v => lineW = v);
    bindRange('hueSpd', 'hueSpdVal', parseFloat, v => v.toFixed(1), v => hueSpd = v);
    bindRange('ghost', 'ghostVal', parseFloat, v => v.toFixed(2), v => ghost = v);
    bindRange('pulse', 'pulseVal', parseFloat, v => v.toFixed(2), v => pulse = v);

    function animState(t) {
      t = ((t % 1) + 1) % 1;
      const signed = t < 0.5 ? (2 * t) : (2 * t - 2);
      return { rho: (Math.PI/2)*Math.abs(signed), beta: (Math.PI/2)*signed };
    }


    // Fly: integrate travel along the circle-plane normal as that normal tilts.
    // Path is built on meridian 0 then spun by longitude so phased circles stay in sequence.
    // Raw ∫n has a small net equatorial drift per cycle; we remove it so the path returns
    // (matches the grow/shrink symmetry — circles come home each cycle).
    var flyTable = [[0, 0]];
    var flyEnd = [0, 0];
    function rebuildFlyTable() {
      const n = 512;
      const tab = [[0, 0]];
      let x = 0, y = 0;
      for (let i = 1; i <= n; i++) {
        const t0 = (i - 1) / n;
        const t1 = i / n;
        const st = animState(t0);
        const nx = Math.cos(st.beta), ny = Math.sin(st.beta);
        let w = 1;
        if (flyVel) w = 0.18 + 0.82 * Math.sin(st.rho); // slow when tiny, fast when open
        const ds = (t1 - t0) * CYCLE;
        x += nx * w * ds;
        y += ny * w * ds;
        tab.push([x, y]);
      }
      flyTable = tab;
      flyEnd = [x, y];
    }
    function sampleFlyLocal(t) {
      t = ((t % 1) + 1) % 1;
      const n = flyTable.length - 1;
      const idx = t * n;
      const i0 = Math.floor(idx);
      const i1 = Math.min(n, i0 + 1);
      const u = idx - i0;
      const a = flyTable[i0], b = flyTable[i1];
      const lx = a[0] + (b[0] - a[0]) * u;
      const ly = a[1] + (b[1] - a[1]) * u;
      // close the loop: subtract linear drift so off(0) = off(1) = 0
      return [lx - t * flyEnd[0], ly - t * flyEnd[1], 0];
    }
    function rotateY(v, lon) {
      const c = Math.cos(lon), s = Math.sin(lon);
      return [v[0] * c, v[1], -v[0] * s];
    }
    function flyOffset(t, lon) {
      if (flyBlend < 1e-4 || flyAlt <= 1e-6) return [0, 0, 0];
      const local = sampleFlyLocal(t);
      const s = flyAlt * (flyIn ? -1 : 1) * flyBlend;
      return rotateY([local[0] * s, local[1] * s, 0], lon);
    }
    rebuildFlyTable();



    let W, H, cx, cy, scale, dpr;
    let rotY = 0.7, rotX = 0.32, zoom = 280;
    let drag = false, lx = 0, ly = 0, pointers = new Map();
    let pinchStartDist = 0, pinchStartZoom = 280;
    let viewLift = 0;   // 0 = centered, 1 = raised above controls
    let viewLiftPx = 0; // last computed lift distance (px)
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W/2; cy = H/2; scale = Math.min(W, H)/3.6;
    }
    function updateViewLift(dt) {
      const open = panel.classList.contains('open');
      if (open) {
        const ph = panel.getBoundingClientRect().height || H * 0.45;
        // Center the scene in the free band above the sheet
        viewLiftPx = Math.min(H * 0.28, Math.max(H * 0.14, ph * 0.45));
      }
      const target = open ? 1 : 0;
      viewLift += (target - viewLift) * Math.min(1, dt * 4.2);
      if (Math.abs(viewLift - target) < 0.001) viewLift = target;
      cy = H / 2 - viewLift * viewLiftPx;
    }
    resize();
    addEventListener('resize', resize);
    addEventListener('orientationchange', () => setTimeout(resize, 200));

    function pinchDist() {
      if (pointers.size < 2) return 0;
      const pts = Array.from(pointers.values());
      const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      return Math.hypot(dx, dy) || 0;
    }
    function beginPinch() {
      pinchStartDist = pinchDist();
      pinchStartZoom = zoom;
      drag = false;
    }
    let tapInfo = null;
    function onDown(x, y, id) {
      if (panel.classList.contains('open')) { closePanel(); return; }
      pointers.set(id, { x, y });
      hideHint(); keepAwake();
      if (pointers.size >= 2) { tapInfo = null; beginPinch(); }
      else {
        drag = true; lx = x; ly = y;
        tapInfo = { id, x, y, t: performance.now() };
      }
    }
    function onMove(x, y, id) {
      if (!pointers.has(id)) return;
      pointers.set(id, { x, y });
      if (pointers.size >= 2) {
        const d = pinchDist();
        if (pinchStartDist > 8 && d > 8) {
          zoom = Math.max(40, Math.min(2000, pinchStartZoom * (d / pinchStartDist)));
        }
        return;
      }
      if (!drag) return;
      rotY += (x - lx) * 0.008;
      rotX = Math.max(-1.4, Math.min(1.4, rotX + (y - ly) * 0.008));
      lx = x; ly = y;
    }
    function onUp(id) {
      if (tapInfo && tapInfo.id === id && pointers.size === 1) {
        const p = pointers.get(id);
        const dt = performance.now() - tapInfo.t;
        const dist = p ? Math.hypot(p.x - tapInfo.x, p.y - tapInfo.y) : 99;
        if (autoFlow && dt < 280 && dist < 14) pickFlowSlider(); // silent jump
      }
      tapInfo = null;
      pointers.delete(id);
      if (pointers.size >= 2) beginPinch();
      else if (pointers.size === 1) {
        const p = pointers.values().next().value;
        drag = true; lx = p.x; ly = p.y;
        pinchStartDist = 0;
      } else {
        drag = false;
        pinchStartDist = 0;
      }
    }
    canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY, e.pointerId); });
    canvas.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY, e.pointerId); });
    canvas.addEventListener('pointerup', e => onUp(e.pointerId));
    canvas.addEventListener('pointercancel', e => onUp(e.pointerId));
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      zoom = Math.max(40, Math.min(2000, zoom - e.deltaY * 0.45));
    }, { passive: false });

    let wakeLock = null;
    async function keepAwake() {
      try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
    function hideHint() { hint.classList.add('hide'); }
    setTimeout(hideHint, 5000);

    const stars = Array.from({length:140}, () => [(Math.random()-0.5)*28,(Math.random()-0.5)*28,(Math.random()-0.5)*28]);
    function rnd(a,b){ return a+Math.random()*(b-a); }
    function setSliderSilent(id, v) { const el=$(id); if(!el) return; el.value=v; el.dispatchEvent(new Event('input')); }
    function setCheckSilent(id, on) { const el=$(id); if(!el) return; el.checked=on; el.dispatchEvent(new Event('change')); }

    // Auto-flow: wander ONE slider at a time for a random hold (up to 20s). Tap jumps to another.
    const FLOW_SLIDERS = [
      { key:'N', id:'count', min:1, max:108, int:true, get:()=>N, set:v=>{ N=Math.round(v); setSliderSilent('count', N); } },
      { key:'phase', id:'phase', min:0, max:1, get:()=>phase, set:v=>{ phase=v; setSliderSilent('phase', v); } },
      { key:'rate', id:'rate', min:0.05, max:4, get:()=>rate, set:v=>{ rate=v; setSliderSilent('rate', v); } },
      { key:'twist', id:'twist', min:0, max:4, get:()=>twist, set:v=>{ twist=v; setSliderSilent('twist', v); } },
      { key:'drift', id:'drift', min:0, max:2, get:()=>drift, set:v=>{ drift=v; setSliderSilent('drift', v); } },
      { key:'lineW', id:'width', min:0.4, max:5, get:()=>lineW, set:v=>{ lineW=v; setSliderSilent('width', v); } },
      { key:'hueSpd', id:'hueSpd', min:0, max:80, get:()=>hueSpd, set:v=>{ hueSpd=v; setSliderSilent('hueSpd', v); } },
      { key:'pulse', id:'pulse', min:0, max:1, get:()=>pulse, set:v=>{ pulse=v; setSliderSilent('pulse', v); } },
      { key:'ghost', id:'ghost', min:0, max:0.92, get:()=>ghost, set:v=>{ ghost=v; setSliderSilent('ghost', v); } },
      { key:'flyAlt', id:'flyAlt', min:0, max:2, get:()=>flyAlt, set:v=>{ flyAlt=v; setSliderSilent('flyAlt', v); } },
      { key:'hue0', id:null, min:0, max:360, get:()=>hue0, set:v=>{ hue0=((v%360)+360)%360; } }
    ];
    var flowKey = null, flowDir = 1, flowHold = 0;
    function pickFlowSlider() {
      const pool = FLOW_SLIDERS.filter(s => s.key !== flowKey);
      const s = pool[Math.floor(Math.random() * pool.length)] || FLOW_SLIDERS[0];
      flowKey = s.key;
      flowDir = Math.random() < 0.5 ? -1 : 1;
      flowHold = rnd(2.5, 20); // stay on this slider up to 20s
    }
    function tickFlow(dt) {
      if (!autoFlow || paused) return;
      flowHold -= dt;
      if (!flowKey || flowHold <= 0) pickFlowSlider();
      const s = FLOW_SLIDERS.find(x => x.key === flowKey);
      if (!s) return;
      const span = Math.max(1e-6, s.max - s.min);
      // flowSpd scales how fast it crawls the range
      let next = s.get() + flowDir * span * (0.035 * flowSpd) * dt;
      if (next >= s.max) { next = s.max; flowDir = -1; }
      if (next <= s.min) { next = s.min; flowDir = 1; }
      if (s.int) next = Math.round(next);
      s.set(next);
    }
    controlsReady = true;
    syncQuick();
    if (autoFlow) pickFlowSlider();

    function rot(p) {
      let [x,y,z]=p;
      const cy=Math.cos(rotY), sy=Math.sin(rotY), cxr=Math.cos(rotX), sx=Math.sin(rotX);
      let x1=x*cy-z*sy, z1=x*sy+z*cy;
      return [x1, y*cxr-z1*sx, y*sx+z1*cxr];
    }
    function proj(p) {
      const [x,y,z]=rot(p);
      const f = zoom/(zoom + z*scale*0.15 + scale);
      return {x: cx+x*scale*f, y: cy-y*scale*f, z, f};
    }
    function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
    function segCount(){ if(N>256)return 24; if(N>128)return 36; if(N>64)return 48; return 64; }
    function circlePts(u, rho, offset, seg) {
      const pts=[];
      let e2 = Math.abs(u[2])>0.9 ? [1,0,0] : [0,0,1];
      let e1=[u[1]*e2[2]-u[2]*e2[1], u[2]*e2[0]-u[0]*e2[2], u[0]*e2[1]-u[1]*e2[0]];
      let n1=Math.hypot(e1[0],e1[1],e1[2])||1; e1=[e1[0]/n1,e1[1]/n1,e1[2]/n1];
      e2=[e1[1]*u[2]-e1[2]*u[1], e1[2]*u[0]-e1[0]*u[2], e1[0]*u[1]-e1[1]*u[0]];
      const cx0=R*Math.cos(rho), rr=R*Math.sin(rho);
      for (let i=0;i<=seg;i++){
        const a=(i/seg)*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
        pts.push(proj([cx0*u[0]+rr*(ca*e1[0]+sa*e2[0])+offset[0], cx0*u[1]+rr*(ca*e1[1]+sa*e2[1])+offset[1], cx0*u[2]+rr*(ca*e1[2]+sa*e2[2])+offset[2]]));
      }
      return pts;
    }
    function strokePts(pts, color, width) {
      if (pts.length<2) return;
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.moveTo(pts[0].x, pts[0].y); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
    function fillPts(pts, color) {
      if (pts.length<3) return;
      ctx.beginPath(); ctx.fillStyle=color; ctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); ctx.fill();
    }
    function drawDot(p, color, r) {
      const q=proj(p); ctx.beginPath(); ctx.fillStyle=color; ctx.arc(q.x,q.y,Math.max(1,r*q.f),0,Math.PI*2); ctx.fill();
    }
    function hsla(h,s,l,a){ return `hsla(${((h%360)+360)%360} ${s}% ${l}% / ${a})`; }

    const t0 = performance.now();
    let lastNow = t0, simTime = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now-lastNow)*0.001); lastNow = now;
      if (!paused) simTime += dt;
      tickFlow(dt);
      updateViewLift(dt);
      // smooth settle when toggling fly
      const flyTarget = flyMode ? 1 : 0;
      flyBlend += (flyTarget - flyBlend) * Math.min(1, dt * 2.8);
      if (Math.abs(flyBlend - flyTarget) < 0.001) flyBlend = flyTarget;
      const baseT = (simTime * rate) / CYCLE;
      if (autoSpin && !drag && pointers.size < 2) rotY += 0.08 * dt;

      if (ghost > 0.001) { ctx.fillStyle = `rgba(5,5,12,${1-ghost})`; ctx.fillRect(0,0,W,H); }
      else { ctx.fillStyle = '#05050c'; ctx.fillRect(0,0,W,H); }

      if (starsOn) {
        for (const s of stars) {
          const q = proj(s);
          const a = 0.25 + 0.55*((s[0]*13.7+s[1]*7.1)%1+1)%1;
          ctx.fillStyle = `rgba(220,230,255,${a})`; ctx.fillRect(q.x,q.y,1.2,1.2);
        }
      }
      const seg = segCount();
      const doGlow = glow && N <= 140;
      const doDots = showDots && N <= 180;
      const doTrails = flyBlend > 0.04 && showTrails && N <= 64;
      if (showEq) strokePts(circlePts([0,1,0], Math.PI/2, [0,0,0], 48), 'rgba(255,210,80,0.85)', 2);

      const hueNow = hue0 + simTime * hueSpd;
      const items = [];
      for (let k = 0; k < N; k++) {
        const stagger = N > 1 ? (phase * k) / N : 0;
        const tk = baseT + stagger;
        const { rho, beta } = animState(tk);
        const lon = (2*Math.PI*k)/N + simTime*drift + twist*beta;
        const cl = Math.cos(lon), sl = Math.sin(lon);
        const n = [Math.cos(beta)*cl, Math.sin(beta), Math.cos(beta)*sl];
        const off = flyOffset(tk, lon);
        const center = add([R*Math.cos(rho)*n[0], R*Math.cos(rho)*n[1], R*Math.cos(rho)*n[2]], off);
        items.push({ k, rho, n, off, center, T:[R*cl,0,R*sl], cz: rot(center)[2] });
      }
      if (N <= 200) items.sort((a,b)=>a.cz-b.cz);
      const wScale = N > 200 ? Math.max(0.45, 1.4 - N/700) : 1;
      for (const it of items) {
        const {k,rho,n,off,center,T} = it;
        const h = hueNow + (k/Math.max(N,1))*360;
        const pul = 1 + pulse*Math.sin(simTime*3.2 + k*0.4);
        const w = lineW * pul * wScale;
        const col = hsla(h,90,62,N>200?0.7:0.95);
        if (doTrails) {
          const tr = trails[k]; tr.push(center.slice());
          if (tr.length > TRAIL_LEN) tr.shift();
          if (tr.length > 1) strokePts(tr.map(p=>proj(p)), hsla(h,80,60,0.35), 1.1);
        }
        if (rho > 1e-4) {
          const pts = circlePts(n, rho, off, seg);
          if (fillOn && fillAmt > 0 && N <= 140) fillPts(pts, hsla(h,85,55,fillAmt*pul));
          if (doGlow) {
            ctx.save(); ctx.globalCompositeOperation='lighter';
            strokePts(pts, hsla(h,100,60,0.12), w*5.5);
            strokePts(pts, hsla(h,95,70,0.28), w*2.4);
            ctx.restore();
          }
          strokePts(pts, col, w);
        }
        if (doDots) {
          drawDot(center, col, 3.4*pul);
          if (N <= 80) drawDot(T, 'rgba(255,210,80,0.9)', 2.6);
        }
      }
    }
    frame(t0);
  </script>
</body>
</html>
