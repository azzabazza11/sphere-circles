<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05050c">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Circles</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050c; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #fab {
      position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 6;
      background: rgba(8,10,18,0.85); color: #c8ffe8; border: 1px solid rgba(68,255,170,0.45);
      border-radius: 22px; padding: 10px 16px; font: 600 14px system-ui, sans-serif;
      backdrop-filter: blur(8px); cursor: pointer; -webkit-tap-highlight-color: transparent;
      min-width: 96px; text-align: center;
    }
    #scrim {
      display: none; position: fixed; inset: 0; z-index: 4;
      background: rgba(0,0,0,0.45);
    }
    #scrim.open { display: block; }
    #panel {
      position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5; max-height: 52vh; overflow: auto;
      background: rgba(8,10,18,0.94); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 10px 12px 12px;
      font-family: system-ui, sans-serif; color: #d0d6e0;
      display: none; backdrop-filter: blur(10px);
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    #panel.open { display: block; }
    #panel .actions { display: flex; gap: 8px; margin-top: 10px; }
    #panel .actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px 10px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #doneBtn { background: #44ffaa; color: #062218; }
    #reloadBtn { background: rgba(255,255,255,0.1); color: #e8eef8; border: 1px solid rgba(255,255,255,0.15) !important; }

    #installBtn {
      background: rgba(255,204,68,0.18); color: #ffe9a8;
      border: 1px solid rgba(255,204,68,0.4) !important;
    }
    #installBtn[hidden] { display: none !important; }
    #launchMode, #quickLaunch {
      background: rgba(255,102,136,0.16); color: #ffb3c4;
      border: 1px solid rgba(255,102,136,0.45) !important;
    }
    #launchMode.on, #quickLaunch.on {
      color: #2a0610; background: #ff6688; border-color: #ff99aa !important;
      box-shadow: 0 0 16px rgba(255,102,136,0.35);
    }
    #launchMode[hidden], #quickLaunch[hidden] { display: none !important; }
    #qrInstall {
      width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      background: rgba(255,204,68,0.2); color: #ffe9a8;
      border: 1px solid rgba(255,204,68,0.45);
      -webkit-tap-highlight-color: transparent;
    }
    #qrInstall[hidden] { display: none !important; }
    #toast {
      position: fixed; left: 50%; bottom: calc(var(--dock-h, 72px) + 16px);
      transform: translateX(-50%);
      z-index: 30; max-width: min(92vw, 340px);
      padding: 12px 16px; border-radius: 12px;
      background: rgba(16,20,30,0.94); color: #e8eef8;
      border: 1px solid rgba(255,255,255,0.12);
      font: 600 13px system-ui, sans-serif; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    #toast.show { opacity: 1; }
    #ver { text-align: center; color: #667; font-size: 10px; margin-top: 8px; }
    #panel .acc { border-top: 1px solid rgba(255,255,255,0.08); }
    #panel .acc:first-child { border-top: 0; }
    #panel .acc-h {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: transparent; border: 0; color: #7fd4ff; cursor: pointer;
      font: 650 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 12px 4px; -webkit-tap-highlight-color: transparent;
    }
    #panel .acc-h::after { content: '▸'; color: #668; font-size: 12px; }
    #panel .acc.open .acc-h::after { content: '▾'; }
    #panel .acc-b { display: none; padding: 0 2px 8px; }
    #panel .acc.open .acc-b { display: block; }
    #panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    #panel label {
      display: grid; grid-template-columns: 64px 1fr 40px;
      align-items: center; gap: 8px; font-size: 12px; margin: 8px 0;
      min-height: 36px;
    }
    #panel input[type="range"] {
      width: 100%; height: 32px; accent-color: #44ffaa;
      -webkit-appearance: none; appearance: none; background: transparent;
    }
    #panel input[type="range"]::-webkit-slider-runnable-track {
      height: 12px; border-radius: 999px; background: rgba(255,255,255,0.14);
    }
    #panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; margin-top: -8px;
      border-radius: 50%; background: #44ffaa; border: 2px solid #0a1a14;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    #panel input[type="range"]::-moz-range-track {
      height: 12px; border-radius: 999px; background: rgba(255,255,255,0.14);
    }
    #panel input[type="range"]::-moz-range-thumb {
      width: 28px; height: 28px; border-radius: 50%; background: #44ffaa;
      border: 2px solid #0a1a14;
    }
    
    .togs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
    .tog {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: #8a93a3;
      border-radius: 999px;
      padding: 10px 14px;
      font: 650 12px system-ui, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tog.on {
      color: #062218;
      background: #44ffaa;
      border-color: #6dffc0;
      box-shadow: 0 0 0 1px rgba(68,255,170,0.25), 0 0 16px rgba(68,255,170,0.28);
    }
    #panel .val { color: #44ffaa; font-weight: 600; text-align: right; font-size: 12px; }

    #dock {
      position: fixed; left: 0; right: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 3; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #quick, .tier-sheet {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      padding: 2px 16px;
      pointer-events: auto;
      scrollbar-width: none;
    }
    #quick::-webkit-scrollbar, .tier-sheet::-webkit-scrollbar { display: none; }
    #tier { display: none; pointer-events: auto; }
    #tier.open { display: block; }
    .tier-sheet { display: none; }
    .tier-sheet.on { display: flex; }
    #quick button, .tier-sheet > button {
      flex: 0 0 auto;
      min-width: 88px; padding: 12px 18px; border-radius: 999px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8,10,18,0.78); color: #c8d0dc;
      font: 650 14px system-ui, sans-serif;
      backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent; cursor: pointer;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #quick button.on, .tier-sheet > button.on {
      color: #062218; background: #44ffaa; border-color: #44ffaa;
    }
    .stick {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      min-width: 118px;
      min-height: 44px;
      touch-action: pan-x;
    }
    .stick-knob {
      position: absolute; left: 50%; top: 50%;
      width: 12px; height: 12px; margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: rgba(68,255,170,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      pointer-events: none;
      transition: transform .12s ease;
    }
    .stick.armed {
      touch-action: none;
    }
    .stick.armed .stick-knob { transition: none; background: #44ffaa; }
    .tier-sheet.stick-locked, #quick.stick-locked {
      overflow-x: hidden;
      touch-action: none;
    }
    .stick-label { position: relative; z-index: 1; user-select: none; -webkit-user-select: none; }
    #stickHud {
      position: fixed; z-index: 4; width: 222px;
      pointer-events: none; opacity: 0;
      transform: translateX(-50%);
      transition: opacity .25s ease;
    }
    #stickHud.show { opacity: 1; }
    #stickHud.fade { opacity: 0; transition: opacity .7s ease; }
    #stickHudLabel {
      color: #c8ffe8; font: 650 17px system-ui, sans-serif;
      text-align: center; margin-bottom: 6px;
      text-shadow: 0 1px 6px #000;
    }
    #stickHudTrack {
      height: 12px; border-radius: 999px;
      background: rgba(255,255,255,0.16);
      overflow: hidden;
    }
    #stickHudFill {
      height: 100%; width: 0%; border-radius: 999px;
      background: #44ffaa;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: calc(var(--dock-h, 72px) + 10px); text-align: center; color: #c8d0dc;
      font-family: system-ui, sans-serif; font-size: 13px; text-shadow: 0 1px 8px #000;
      pointer-events: none; opacity: 1; transition: opacity 1.2s ease; padding: 0 20px;
    }

    #qrModal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
      padding: 24px;
    }
    #qrModal.open { display: flex; }
    #qrCard {
      background: #10141e; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 18px 18px 14px; text-align: center;
      max-width: 300px; width: 100%;
      font-family: system-ui, sans-serif; color: #d0d6e0;
    }
    #qrCard img {
      width: 220px; height: 220px; border-radius: 10px; background: #fff;
      display: block; margin: 0 auto 12px;
    }
    #qrUrl {
      font-size: 11px; color: #8ab; word-break: break-all; margin-bottom: 12px; line-height: 1.35;
    }
    #qrCard .qr-actions { display: flex; gap: 8px; }
    #qrCard .qr-actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #qrClose { background: #44ffaa; color: #062218; }
    #qrCopy { background: rgba(255,255,255,0.1); color: #e8eef8; }

    #qrKofi {
      width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      background: #ff5e5b; color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    #qrHub {
      display: block; width: 100%; margin-top: 8px; border-radius: 10px; padding: 12px 8px;
      font: 650 13px system-ui, sans-serif; text-align: center; text-decoration: none;
      background: rgba(127,212,255,0.12); color: #7fd4ff;
      border: 1px solid rgba(127,212,255,0.28);
      -webkit-tap-highlight-color: transparent;
    }
    #flowHud {
      position: fixed; left: 50%; z-index: 4;
      bottom: calc(var(--dock-h, 72px) + 18px);
      transform: translateX(-50%);
      pointer-events: none; opacity: 0;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      transition: opacity .25s ease;
    }
    #flowHud.show { opacity: 1; }
    .flowHud-row { width: 222px; }
    .flowHud-lab {
      color: #c8ffe8; font: 650 17px system-ui, sans-serif;
      text-align: center; margin-bottom: 6px;
      text-shadow: 0 1px 6px #000;
    }
    .flowHud-track {
      height: 12px; border-radius: 999px;
      background: rgba(255,255,255,0.16);
      overflow: hidden;
    }
    .flowHud-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: #44ffaa;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="scrim"></div>
  <button id="fab" type="button">Controls</button>
  <div id="stickHud">
    <div id="stickHudLabel">Ghost 0.18</div>
    <div id="stickHudTrack"><div id="stickHudFill"></div></div>
  </div>
  <div id="flowHud"></div>
  <div id="dock">
    <div id="tier">
      <div class="tier-sheet" data-sheet="look">
        <button type="button" id="quickPond">Pond</button>
        <button type="button" id="quickEq" class="on" aria-pressed="true">Equator</button>
        <button type="button" id="quickDots" class="on" aria-pressed="true">Dots</button>
        <button type="button" id="quickFill">Fill</button>
        <button type="button" class="stick" id="stickWidth" aria-label="Width"><span class="stick-knob"></span><span class="stick-label">Width</span></button>
        <button type="button" class="stick" id="stickHueSpd" aria-label="Hue spd"><span class="stick-knob"></span><span class="stick-label">Hue spd</span></button>
        <button type="button" class="stick" id="stickGhost" aria-label="Ghost"><span class="stick-knob"></span><span class="stick-label">Ghost</span></button>
        <button type="button" class="stick" id="stickPulse" aria-label="Pulse"><span class="stick-knob"></span><span class="stick-label">Pulse</span></button>
      </div>
      <div class="tier-sheet" data-sheet="fly">
        <button type="button" id="quickFlyVel">Vel by R</button>
        <button type="button" id="quickFlyIn">Inward</button>
        <button type="button" id="quickFlyMirror">Mirror</button>
        <button type="button" class="stick" id="stickAlt" aria-label="Altitude"><span class="stick-knob"></span><span class="stick-label">Altitude</span></button>
      </div>
      <div class="tier-sheet" data-sheet="motion">
        <button type="button" id="quickOrbit" class="on" aria-pressed="true">Orbit</button>
        <button type="button" id="quickTilt">Tilt</button>
        <button type="button" class="stick" id="stickCount" aria-label="Circles"><span class="stick-knob"></span><span class="stick-label">Circles</span></button>
        <button type="button" class="stick" id="stickPhase" aria-label="Phase"><span class="stick-knob"></span><span class="stick-label">Phase</span></button>
        <button type="button" class="stick" id="stickRate" aria-label="Rate"><span class="stick-knob"></span><span class="stick-label">Rate</span></button>
        <button type="button" class="stick" id="stickTwist" aria-label="Twist"><span class="stick-knob"></span><span class="stick-label">Twist</span></button>
        <button type="button" class="stick" id="stickDrift" aria-label="Drift"><span class="stick-knob"></span><span class="stick-label">Drift</span></button>
        <button type="button" class="stick" id="stickFlowSpd" aria-label="Flow spd"><span class="stick-knob"></span><span class="stick-label">Flow spd</span></button>
      </div>
    </div>
    <div id="quick">
      <button type="button" id="quickFly">Fly</button>
      <button type="button" id="quickFlow" class="on">Flow</button>
      <button type="button" id="quickLook">Look</button>
      <button type="button" id="quickMotion">Motion</button>
      <button type="button" id="quickGlow" class="on" aria-pressed="true">Glow</button>
      <button type="button" id="quickStars" class="on" aria-pressed="true">Stars</button>
      <button type="button" id="quickTrails" class="on" aria-pressed="true">Trails</button>
      <button type="button" id="quickLaunch" hidden>Launch</button>
    </div>
  </div>
  <div id="panel">
    <div class="acc open" data-acc>
      <button type="button" class="acc-h">Motion</button>
      <div class="acc-b">
        <label>Circles <input id="count" type="range" min="1" max="108" step="1" value="16"><span class="val" id="countVal">16</span></label>
        <label>Phase <input id="phase" type="range" min="0" max="1" step="0.001" value="0.35"><span class="val" id="phaseVal">0.35</span></label>
        <label>Rate <input id="rate" type="range" min="0.05" max="4" step="0.01" value="1"><span class="val" id="rateVal">1.00×</span></label>
        <label>Twist <input id="twist" type="range" min="0" max="4" step="0.01" value="0"><span class="val" id="twistVal">0.00</span></label>
        <label>Drift <input id="drift" type="range" min="0" max="2" step="0.01" value="0"><span class="val" id="driftVal">0.00</span></label>
        <div class="togs">
          <button type="button" class="tog on" id="autoFlow" aria-pressed="true">Auto flow</button>
          <button type="button" class="tog on" id="autoSpin" aria-pressed="true">Orbit</button>
          <button type="button" class="tog" id="tiltOn" aria-pressed="false">Tilt</button>
          <button type="button" class="tog" id="launchMode" aria-pressed="false" hidden>Launch</button>
        </div>
        <label>Flow spd <input id="flowSpd" type="range" min="0.15" max="2" step="0.01" value="0.5"><span class="val" id="flowSpdVal">0.50</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Fly</button>
      <div class="acc-b">
        <div class="togs">
          <button type="button" class="tog" id="flyMode" aria-pressed="false">Fly</button>
          <button type="button" class="tog" id="flyVel" aria-pressed="false">Vel by R</button>
          <button type="button" class="tog" id="flyIn" aria-pressed="false">Inward</button>
          <button type="button" class="tog" id="flyMirror" aria-pressed="false">Mirror</button>
          <button type="button" class="tog on" id="showTrails" aria-pressed="true">Trails</button>
        </div>
        <label>Altitude <input id="flyAlt" type="range" min="0" max="3.5" step="0.01" value="1.25"><span class="val" id="flyAltVal">1.25</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Look</button>
      <div class="acc-b">
        <div class="togs">
          <button type="button" class="tog on" id="glow" aria-pressed="true">Glow</button>
          <button type="button" class="tog on" id="starsOn" aria-pressed="true">Stars</button>
          <button type="button" class="tog" id="pondOn" aria-pressed="false">Pond</button>
          <button type="button" class="tog on" id="showEq" aria-pressed="true">Equator</button>
          <button type="button" class="tog on" id="showDots" aria-pressed="true">Dots</button>
          <button type="button" class="tog" id="fillOn" aria-pressed="false">Fill</button>
        </div>
        <label>Width <input id="width" type="range" min="0.4" max="5" step="0.05" value="1.6"><span class="val" id="widthVal">1.60</span></label>
        <label>Hue spd <input id="hueSpd" type="range" min="0" max="80" step="0.5" value="8"><span class="val" id="hueSpdVal">8.0</span></label>
        <label>Ghost <input id="ghost" type="range" min="0" max="0.92" step="0.01" value="0.18"><span class="val" id="ghostVal">0.18</span></label>
        <label>Pulse <input id="pulse" type="range" min="0" max="1" step="0.01" value="0.25"><span class="val" id="pulseVal">0.25</span></label>
      </div>
    </div>
    <div class="actions">
      <button id="shareBtn" type="button" style="background:rgba(127,212,255,0.18);color:#cfefff;border:1px solid rgba(127,212,255,0.35)">Share</button>
      <button id="installBtn" type="button">Install app</button>
    </div>
    <div class="actions">
      <button id="doneBtn" type="button">Done</button>
      <button id="reloadBtn" type="button">Reload</button>
    </div>
    <div id="ver">v1.6.5 · flow HUD · finer stick curve · two-tier dock</div>
  </div>

  <div id="qrModal">
    <div id="qrCard">
      <img id="qrImg" width="220" height="220" alt="Share QR">
      <div id="qrUrl"></div>
      <div class="qr-actions">
        <button type="button" id="qrCopy">Copy link</button>
        <button type="button" id="qrClose">Close</button>
      </div>
      <button type="button" id="qrInstall">Install app</button>
      <button type="button" id="qrKofi">Support on Ko-fi</button>
      <a id="qrHub" href="https://azzabazza11.github.io/" target="_blank" rel="noopener noreferrer">More apps →</a>
    </div>
  </div>

  <div id="toast"></div>
  <div id="hint">Pinch · Tilt steers the view · Launch (after Tilt) flies the flock<br>Controls for more · Auto flow wanders on its own</div>
  <script>
    const $ = (id) => document.getElementById(id);
    let N = 16, phase = 0.35, rate = 1, twist = 0, drift = 0;
    let flyMode = false, flyAlt = 1.25, flyIn = false, flyVel = false, flyMirror = false, showTrails = true;
    let flyBlend = 0; // 0 = on sphere, 1 = full fly (smooth settle)
    let launchMode = false, launchBlend = 0;
    let launchZoomBase = 280, chasePanX = 0, chasePanY = 0;
    let snakeReady = false, leadLon = 0;
    let leadHeading = [0, 1, 0], leadVel = [0, 0, 0];
    let snakePos = null, snakeN = null;
    let tiltDiscovered = false;
    try { tiltDiscovered = localStorage.getItem('circles_tilt_discovered') === '1'; } catch (e) {}
    let showEq = true, showDots = true, glow = true, fillOn = false, starsOn = true, pondOn = false, autoSpin = true, tiltOn = false;
    let pondFrac = 0.2; // pond height as fraction of screen (horizon = 1 - pondFrac)
    try {
      const pf = parseFloat(localStorage.getItem('circles_pond_frac'));
      if (Number.isFinite(pf)) pondFrac = pf;
    } catch (e) {}
    let pondDragging = false, pondDragId = null;
    let activeSheet = null;
    let stickState = null;
    let lineW = 1.6, hue0 = 0, hueSpd = 8, pulse = 0.25, ghost = 0.18, fillAmt = 0.06;
    let autoFlow = true, flowSpd = 0.5, paused = false, showNrm = false;

    const APP_VER = '1.6.5';
    const canvas = $('c');
    const ctx = canvas.getContext('2d', { alpha: false });

    });
    bindStick('stickHueSpd', {
      label: 'Hue spd', min: 0, max: 80,
      get: () => hueSpd,
      set: v => { hueSpd = v; setSliderSilent('hueSpd', v); },
      fmt: v => v.toFixed(1)
    });
    bindStick('stickPulse', {
      label: 'Pulse', min: 0, max: 1,
      get: () => pulse,
      set: v => { pulse = v; setSliderSilent('pulse', v); },
      fmt: v => v.toFixed(2)
    });
    bindStick('stickAlt', {
      label: 'Altitude', min: 0, max: 3.5,
      get: () => flyAlt,
      set: v => { flyAlt = v; setSliderSilent('flyAlt', v); },
      fmt: v => v.toFixed(2)
    });
    bindStick('stickCount', {
      label: 'Circles', min: 1, max: 108, int: true,
      get: () => N,
      set: v => { N = Math.round(v); setSliderSilent('count', N); },
      fmt: v => String(Math.round(v))
    });
    bindStick('stickPhase', {
      label: 'Phase', min: 0, max: 1,
      get: () => phase,
      set: v => { phase = v; setSliderSilent('phase', v); },
      fmt: v => v.toFixed(2)
    });
    bindStick('stickRate', {
      label: 'Rate', min: 0.05, max: 4,
      get: () => rate,
      set: v => { rate = v; setSliderSilent('rate', v); },
      fmt: v => v.toFixed(2) + '×'
    });
    bindStick('stickTwist', {
      label: 'Twist', min: 0, max: 4,
      get: () => twist,
      set: v => { twist = v; setSliderSilent('twist', v); },
      fmt: v => v.toFixed(2)
    });
    bindStick('stickDrift', {
      label: 'Drift', min: 0, max: 2,
      get: () => drift,
      set: v => { drift = v; setSliderSilent('drift', v); },
      fmt: v => v.toFixed(2)
    });
    bindStick('stickFlowSpd', {
      label: 'Flow spd', min: 0.15, max: 2,
      get: () => flowSpd,
      set: v => { flowSpd = v; setSliderSilent('flowSpd', v); },
      fmt: v => v.toFixed(2)
    });
    const dockEl = $('dock');
    if (dockEl) {
      dockEl.addEventListener('pointerdown', e => e.stopPropagation());
      dockEl.addEventListener('contextmenu', e => e.preventDefault());
      dockEl.addEventListener('selectstart', e => e.preventDefault());
    }

    // Auto-flow: 1–3 voices wander different sliders at independent rates / hold times.
    const FLOW_SLIDERS = [
      { key:'N', id:'count', min:1, max:108, int:true, label:'Circles', fmt:v=>String(Math.round(v)), get:()=>N, set:v=>{ N=Math.round(v); setSliderSilent('count', N); } },
      { key:'phase', id:'phase', min:0, max:1, label:'Phase', fmt:v=>v.toFixed(2), get:()=>phase, set:v=>{ phase=v; setSliderSilent('phase', v); } },
      { key:'rate', id:'rate', min:0.05, max:4, label:'Rate', fmt:v=>v.toFixed(2)+'×', get:()=>rate, set:v=>{ rate=v; setSliderSilent('rate', v); } },
      { key:'twist', id:'twist', min:0, max:4, label:'Twist', fmt:v=>v.toFixed(2), get:()=>twist, set:v=>{ twist=v; setSliderSilent('twist', v); } },
      { key:'drift', id:'drift', min:0, max:2, label:'Drift', fmt:v=>v.toFixed(2), get:()=>drift, set:v=>{ drift=v; setSliderSilent('drift', v); } },
      { key:'lineW', id:'width', min:0.4, max:5, label:'Width', fmt:v=>v.toFixed(2), get:()=>lineW, set:v=>{ lineW=v; setSliderSilent('width', v); } },
      { key:'hueSpd', id:'hueSpd', min:0, max:80, label:'Hue spd', fmt:v=>v.toFixed(1), get:()=>hueSpd, set:v=>{ hueSpd=v; setSliderSilent('hueSpd', v); } },
      { key:'pulse', id:'pulse', min:0, max:1, label:'Pulse', fmt:v=>v.toFixed(2), get:()=>pulse, set:v=>{ pulse=v; setSliderSilent('pulse', v); } },
      { key:'ghost', id:'ghost', min:0, max:0.92, label:'Ghost', fmt:v=>v.toFixed(2), get:()=>ghost, set:v=>{ ghost=v; setSliderSilent('ghost', v); } },
      { key:'flyAlt', id:'flyAlt', min:0, max:3.5, label:'Altitude', fmt:v=>v.toFixed(2), get:()=>flyAlt, set:v=>{ flyAlt=v; setSliderSilent('flyAlt', v); } },
      { key:'hue0', id:null, min:0, max:360, label:'Hue', fmt:v=>String(Math.round(((v%360)+360)%360)), get:()=>hue0, set:v=>{ hue0=((v%360)+360)%360; } }
    ];
    let flowVoices = [];
    let flowSceneHold = 0;
    let flowTargetVoices = 1;

    function makeFlowVoice(avoidKeys) {
      const lock = launchMode ? new Set(['N', 'phase', 'rate']) : null;
      const pool = FLOW_SLIDERS.filter(s => !avoidKeys.has(s.key) && !(lock && lock.has(s.key)));
      const fallback = FLOW_SLIDERS.filter(s => !(lock && lock.has(s.key)));
      const pickFrom = pool.length ? pool : (fallback.length ? fallback : FLOW_SLIDERS);
      const chosen = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      let spd;
      const roll = Math.random();
      if (roll < 0.08) spd = 0;
      else if (roll < 0.28) spd = rnd(0.12, 0.4);
      else if (roll < 0.82) spd = rnd(0.55, 1.6);
      else spd = rnd(2.0, 4.2);
      return {
        key: chosen.key,
        dir: Math.random() < 0.5 ? -1 : 1,
        spd,
        hold: spd === 0 ? rnd(1.2, 4.5) : rnd(2.0, 18)
      };
    }
    function refreshFlowScene() {
      const r = Math.random();
      flowTargetVoices = r < 0.48 ? 1 : (r < 0.82 ? 2 : 3);
      flowSceneHold = rnd(7, 26);
    }
    function pickFlowSlider() {
      refreshFlowScene();
      flowVoices = [];
      const avoid = new Set();
      for (let i = 0; i < flowTargetVoices; i++) {
        const v = makeFlowVoice(avoid);
        avoid.add(v.key);
        flowVoices.push(v);
      }
    }
    function tickFlow(dt) {
      if (!autoFlow || paused) { updateFlowHud(); return; }
      if (!flowVoices.length) pickFlowSlider();
      flowSceneHold -= dt;
      if (flowSceneHold <= 0) {
        refreshFlowScene();
        while (flowVoices.length > flowTargetVoices) flowVoices.pop();
        const avoid = new Set(flowVoices.map(v => v.key));
        while (flowVoices.length < flowTargetVoices) {
          const v = makeFlowVoice(avoid);
          avoid.add(v.key);
          flowVoices.push(v);
        }
        if (flowVoices.length && Math.random() < 0.45) {
          const i = Math.floor(Math.random() * flowVoices.length);
          avoid.delete(flowVoices[i].key);
          const v = makeFlowVoice(avoid);
          flowVoices[i] = v;
        }
      }
      for (const voice of flowVoices) {
        voice.hold -= dt;
        if (voice.hold <= 0) {
          const avoid = new Set(flowVoices.map(v => v.key));
          avoid.delete(voice.key);
          const next = makeFlowVoice(avoid);
          voice.key = next.key; voice.dir = next.dir; voice.spd = next.spd; voice.hold = next.hold;
        }
        if (voice.spd <= 1e-6) continue;
        if (launchMode && (voice.key === 'N' || voice.key === 'phase' || voice.key === 'rate')) {
          voice.hold = 0;
          continue;
        }
        const s = FLOW_SLIDERS.find(x => x.key === voice.key);
        if (!s) continue;
        const span = Math.max(1e-6, s.max - s.min);
        let next = s.get() + voice.dir * span * (0.03 * flowSpd * voice.spd) * dt;
        if (next >= s.max) { next = s.max; voice.dir = -1; }
        if (next <= s.min) { next = s.min; voice.dir = 1; }
        if (s.int) next = Math.round(next);
        s.set(next);
        // rare mid-hold tempo / direction nudge
        if (Math.random() < dt * 0.04) {
          if (Math.random() < 0.5) voice.dir *= -1;
          else voice.spd = Math.max(0.12, Math.min(4.2, voice.spd * rnd(0.55, 1.7)));
        }
      }
      updateFlowHud();
    }
    function updateFlowHud() {
      const hud = $('flowHud'); if (!hud) return;
      if ((stickState && stickState.armed) || !autoFlow || paused) {
        hud.classList.remove('show');
        return;
      }
      const rows = [];
      for (const voice of flowVoices) {
        if (voice.spd <= 1e-6) continue;
        const s = FLOW_SLIDERS.find(x => x.key === voice.key);
        if (!s) continue;
        const v = s.get();
        const t = (v - s.min) / Math.max(1e-6, s.max - s.min);
        const lab = (s.label || s.key) + ' ' + (s.fmt ? s.fmt(v) : v.toFixed(2));
        rows.push('<div class="flowHud-row"><div class="flowHud-lab">' + lab + '</div><div class="flowHud-track"><div class="flowHud-fill" style="width:' + (Math.max(0, Math.min(1, t)) * 100) + '%"></div></div></div>');
      }
      if (!rows.length) { hud.classList.remove('show'); return; }
      const html = rows.join('');
      if (hud._html !== html) { hud.innerHTML = html; hud._html = html; }
      hud.classList.add('show');
    }
    controlsReady = true;
    syncQuick();
    if (autoFlow) pickFlowSlider();

    function rot(p) {
      let [x,y,z]=p;
      const cy=Math.cos(viewRotY), sy=Math.sin(viewRotY), cxr=Math.cos(viewRotX), sx=Math.sin(viewRotX);
      let x1=x*cy-z*sy, z1=x*sy+z*cy;
      return [x1, y*cxr-z1*sx, y*sx+z1*cxr];
    }
    function projCore(p) {
      const [x,y,z]=rot(p);
      const base = zoom/(zoom + z*scale*0.15 + scale);
      const boost = Math.max(1, zoom / 900);
      const s = scale * base * boost;
      return {x: cx+x*s, y: cy-y*s, z, f: base*boost};
    }
    function proj(p) {
      const q = projCore(p);
      return {x: q.x + chasePanX, y: q.y + chasePanY, z: q.z, f: q.f};
    }
    function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
    function segCount(){ if(N>256)return 24; if(N>128)return 36; if(N>64)return 48; return 64; }
    function circlePts(u, rho, offset, seg) {
      const pts=[];
      let e2 = Math.abs(u[2])>0.9 ? [1,0,0] : [0,0,1];
      let e1=[u[1]*e2[2]-u[2]*e2[1], u[2]*e2[0]-u[0]*e2[2], u[0]*e2[1]-u[1]*e2[0]];
      let n1=Math.hypot(e1[0],e1[1],e1[2])||1; e1=[e1[0]/n1,e1[1]/n1,e1[2]/n1];
      e2=[e1[1]*u[2]-e1[2]*u[1], e1[2]*u[0]-e1[0]*u[2], e1[0]*u[1]-e1[1]*u[0]];
      const cx0=R*Math.cos(rho), rr=R*Math.sin(rho);
      for (let i=0;i<=seg;i++){
        const a=(i/seg)*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
        pts.push(proj([cx0*u[0]+rr*(ca*e1[0]+sa*e2[0])+offset[0], cx0*u[1]+rr*(ca*e1[1]+sa*e2[1])+offset[1], cx0*u[2]+rr*(ca*e1[2]+sa*e2[2])+offset[2]]));
      }
      return pts;
    }
    function strokePts(pts, color, width) {
      if (pts.length<2) return;
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.moveTo(pts[0].x, pts[0].y); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
    function fillPts(pts, color) {
      if (pts.length<3) return;
      ctx.beginPath(); ctx.fillStyle=color; ctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); ctx.fill();
    }
    function drawDot(p, color, r) {
      const q=proj(p); ctx.beginPath(); ctx.fillStyle=color; ctx.arc(q.x,q.y,Math.max(1,r*q.f),0,Math.PI*2); ctx.fill();
    }
    function hsla(h,s,l,a){ return `hsla(${((h%360)+360)%360} ${s}% ${l}% / ${a})`; }

    const t0 = performance.now();
    let lastNow = t0, simTime = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now-lastNow)*0.001); lastNow = now;
      if (!paused) simTime += dt;
      tickFlow(dt);
      tickStick(dt);
      updateViewLift(dt);
      // smooth settle when toggling fly
      const flyTarget = flyMode ? 1 : 0;
      flyBlend += (flyTarget - flyBlend) * Math.min(1, dt * 2.2);
      if (Math.abs(flyBlend - flyTarget) < 0.001) flyBlend = flyTarget;
      const baseT = (simTime * rate) / CYCLE;
      if (autoSpin && !drag && pointers.size < 2 && !tiltOn && !launchMode) rotY += 0.08 * dt;
      updateTiltView(dt);
      updateLaunchPhysics(dt);
      updateLaunchCamera(dt);
      if (launchMode || launchBlend > 0.08) {
        showTrails = true;
        setOn($('showTrails'), true);
        starsOn = true;
        setOn($('starsOn'), true);
        setOn($('quickTrails'), true);
        setOn($('quickStars'), true);
      }

      if (ghost > 0.001) { ctx.fillStyle = `rgba(5,5,12,${1-ghost})`; ctx.fillRect(0,0,W,H); }
      else { ctx.fillStyle = '#05050c'; ctx.fillRect(0,0,W,H); }

      if (starsOn) {
        for (const s of stars) {
          const q = proj(s);
          const a = 0.25 + 0.55*((s[0]*13.7+s[1]*7.1)%1+1)%1;
          const sz = (launchBlend > 0.05) ? 1.35 : 1.2;
          ctx.fillStyle = `rgba(220,230,255,${a})`; ctx.fillRect(q.x,q.y,sz,sz);
        }
      }
      const seg = segCount();
      const doGlow = glow && N <= 140;
      const doDots = showDots && N <= 180;
      const doTrails = showTrails && N <= 108;
      // Equator stays as a home beacon (fades in launch)
      if (showEq) strokePts(circlePts([0,1,0], Math.PI/2, [0,0,0], 48), 'rgba(255,210,80,' + (0.85 * (1 - 0.7 * launchBlend)) + ')', 2);

      const hueNow = hue0 + simTime * hueSpd;
      const lb = launchBlend;
      const items = [];
      for (let k = 0; k < N; k++) {
        const sp = spherePose(k, baseT);
        let rho = sp.rho, n = sp.n, center = sp.center;
        if (snakeReady && lb > 0.001) {
          // Free-flight stocking: blend off the sphere onto snake pos / oriented normals
          center = lerp3(sp.center, snakePos[k], lb);
          n = norm3(lerp3(sp.n, snakeN[k], lb));
        }
        // circlePts expects offset such that surf + offset = center
        const cR = R * Math.cos(rho);
        const off = [center[0] - cR * n[0], center[1] - cR * n[1], center[2] - cR * n[2]];
        const lon = sp.lon;
        const cl = Math.cos(lon), sl = Math.sin(lon);
        items.push({ k, rho, n, off, center, T:[R*cl,0,R*sl], cz: rot(center)[2] });
      }
      if (N <= 200) items.sort((a,b)=>a.cz-b.cz);
      const wScale = N > 200 ? Math.max(0.45, 1.4 - N/700) : (N > 80 ? Math.max(0.55, 1.15 - N/400) : 1);
      for (const it of items) {
        const {k,rho,n,off,center,T} = it;
        const h = hueNow + (k/Math.max(N,1))*360;
        const pul = 1 + pulse*Math.sin(simTime*3.2 + k*0.4);
        const w = lineW * pul * wScale;
        const col = hsla(h,90,62,N>200?0.7:0.95);
        const trailThis = doTrails && (N <= 64 || k === 0 || (k % 3) === 0);
        if (trailThis) {
          const tr = trails[k]; tr.push(center.slice());
          if (tr.length > TRAIL_LEN) tr.shift();
          if (tr.length > 1) strokePts(tr.map(p=>proj(p)), hsla(h,80,60,0.35), 1.1);
        }
        if (rho > 1e-4) {
          const pts = circlePts(n, rho, off, seg);
          if (fillOn && fillAmt > 0 && N <= 140) fillPts(pts, hsla(h,85,55,fillAmt*pul));
          if (doGlow) {
            ctx.save(); ctx.globalCompositeOperation='lighter';
            strokePts(pts, hsla(h,100,60,0.12), w*5.5);
            strokePts(pts, hsla(h,95,70,0.28), w*2.4);
            ctx.restore();
          }
          strokePts(pts, col, w);
        }
        if (doDots) {
          drawDot(center, col, 3.4*pul);
          if (N <= 80) drawDot(T, 'rgba(255,210,80,0.9)', 2.6);
        }
      }
      if (pondOn) drawPondReflect();
    }
    // Cheap fake pond: flip the band just above the horizon into the pond + fade tint.
    // Stars / trails / circles already on the canvas get mirrored for free.
    // Drag near the horizon (pond mode) to raise/lower it — stays above the quick buttons.
    function drawPondReflect() {
      pondFrac = clampPondFrac(pondFrac);
      const pondH = H * pondFrac;
      if (pondH < 8 || W < 8) return;
      const y0 = H - pondH;
      const srcH = Math.min(pondH, y0);
      const srcY = Math.max(0, y0 - srcH);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, y0, W, pondH);
      ctx.clip();
      ctx.translate(0, H);
      ctx.scale(1, -1);
      ctx.globalAlpha = 0.42;
      try {
        ctx.drawImage(
          canvas,
          0, srcY * dpr, W * dpr, srcH * dpr,
          0, 0, W, pondH
        );
      } catch (e) { /* ignore rare self-copy quirks */ }
      ctx.restore();

      // Soft fade into water + horizon grab line
      const g = ctx.createLinearGradient(0, y0, 0, H);
      g.addColorStop(0, 'rgba(5,8,18,0.08)');
      g.addColorStop(0.22, 'rgba(10,28,48,0.22)');
      g.addColorStop(0.65, 'rgba(6,18,36,0.48)');
      g.addColorStop(1, 'rgba(3,8,18,0.78)');
      ctx.fillStyle = g;
      ctx.fillRect(0, y0, W, pondH);
      ctx.fillStyle = pondDragging ? 'rgba(190,220,255,0.45)' : 'rgba(160,200,255,0.18)';
      ctx.fillRect(0, y0, W, pondDragging ? 2.4 : 1.4);
      if (pondDragging) {
        ctx.fillStyle = 'rgba(180,210,255,0.12)';
        ctx.fillRect(0, y0 - 10, W, 20);
      }
    }
    frame(t0);
  </script>
</body>
</html>
