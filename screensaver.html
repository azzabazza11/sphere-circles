<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05050c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <title>Circles</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050c; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; color: #c8d0dc;
      font-family: system-ui, sans-serif; font-size: 13px;
      text-shadow: 0 1px 8px #000; pointer-events: none;
      opacity: 1; transition: opacity 1.2s ease;
      padding: 0 20px;
    }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Tap to keep screen on · auto-flow morphs the look<br>Add to Home Screen for fullscreen</div>
  <script>
    let N = 16, phase = 0.35, rate = 1, twist = 0, drift = 0;
    let flyMode = false, flyAmt = 0.55, flyIn = false, showTrails = true;
    let showSphere = false, showEq = true, showDots = true, showNrm = false;
    let glow = true, fillOn = false, starsOn = true, autoSpin = true;
    let lineW = 1.6, hue0 = 0, hueSpd = 8, pulse = 0.25, ghost = 0.18, fillAmt = 0.06;
    let autoFlow = true, flowSpd = 0.5;
    const paused = false;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const R = 1;
    const CYCLE = 6;
    const MAX_N = 512;
    const TRAIL_LEN = 70;
    const hint = document.getElementById('hint');

    const flight = Array.from({ length: MAX_N }, () => [0, 0, 0]);
    const trails = Array.from({ length: MAX_N }, () => []);

    let W, H, cx, cy, scale, dpr;
    let rotY = 0.7, rotX = 0.32, zoom = 280;
    let drag = false, lx = 0, ly = 0, pointers = new Map();

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2; cy = H / 2;
      scale = Math.min(W, H) / 3.6;
    }
    resize();
    addEventListener('resize', resize);
    addEventListener('orientationchange', () => setTimeout(resize, 200));

    function onDown(x, y, id) {
      pointers.set(id, { x, y });
      drag = true; lx = x; ly = y;
      hideHint(); keepAwake();
    }
    function onMove(x, y, id) {
      if (!pointers.has(id)) return;
      rotY += (x - lx) * 0.008;
      rotX = Math.max(-1.4, Math.min(1.4, rotX + (y - ly) * 0.008));
      lx = x; ly = y;
    }
    function onUp(id) {
      pointers.delete(id);
      if (pointers.size === 0) drag = false;
    }

    canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY, e.pointerId); });
    canvas.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY, e.pointerId); });
    canvas.addEventListener('pointerup', e => onUp(e.pointerId));
    canvas.addEventListener('pointercancel', e => onUp(e.pointerId));
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      zoom = Math.max(40, Math.min(2000, zoom - e.deltaY * 0.45));
    }, { passive: false });

    let wakeLock = null;
    async function keepAwake() {
      try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });
    function hideHint() { hint.classList.add('hide'); }
    setTimeout(hideHint, 5000);

    const stars = Array.from({ length: 140 }, () => [
      (Math.random() - 0.5) * 28,
      (Math.random() - 0.5) * 28,
      (Math.random() - 0.5) * 28
    ]);

    function rnd(a, b) { return a + Math.random() * (b - a); }
    function pickCount() {
      const roll = Math.random();
      if (roll < 0.5) return Math.round(rnd(12, 64));
      if (roll < 0.8) return Math.round(rnd(64, 180));
      if (roll < 0.94) return Math.round(rnd(180, 320));
      return Math.round(rnd(320, 512));
    }
    let flowTarget = {}, flowHold = 0;
    function pickFlowTarget(force) {
      flowTarget = {
        N: pickCount(), phase: rnd(0, 1), rate: rnd(0.3, 1.8), twist: rnd(0, 2.8),
        drift: rnd(0, 0.7), lineW: rnd(0.7, 2.8), hue0: (hue0 + rnd(-90, 130) + 360) % 360,
        hueSpd: rnd(2, 28), pulse: rnd(0, 0.55), ghost: rnd(0.05, 0.65),
        fillAmt: rnd(0.03, 0.14), flyAmt: rnd(0.2, 1.2)
      };
      if (force || Math.random() < 0.4) {
        const mood = Math.random();
        if (mood < 0.55) {
          flyMode = false; fillOn = Math.random() < 0.35; showDots = Math.random() < 0.5;
          showEq = Math.random() < 0.4; glow = Math.random() < 0.85; showNrm = false;
        } else if (mood < 0.8) {
          flyMode = true; showTrails = true; showNrm = Math.random() < 0.35; fillOn = false;
        } else {
          flyMode = false; fillOn = true; showDots = false; showEq = false; glow = true;
        }
      }
      flowHold = rnd(12, 24) / Math.max(0.2, flowSpd);
    }
    pickFlowTarget(true);

    function tickFlow(dt) {
      if (!autoFlow || paused) return;
      flowHold -= dt;
      if (flowHold <= 0) pickFlowTarget(false);
      const speed = 0.07 * flowSpd;
      const map = [
        ['N', v => N = Math.round(v)], ['phase', v => phase = v], ['rate', v => rate = v],
        ['twist', v => twist = v], ['drift', v => drift = v], ['lineW', v => lineW = v],
        ['hueSpd', v => hueSpd = v], ['pulse', v => pulse = v], ['ghost', v => ghost = v],
        ['fillAmt', v => fillAmt = v], ['flyAmt', v => flyAmt = v]
      ];
      for (const [k, set] of map) {
        const cur = ({ N, phase, rate, twist, drift, lineW, hueSpd, pulse, ghost, fillAmt, flyAmt })[k];
        const tgt = flowTarget[k];
        set(cur + (tgt - cur) * Math.min(1, speed));
      }
      let d = ((flowTarget.hue0 - hue0 + 540) % 360) - 180;
      hue0 = ((hue0 + d * Math.min(1, speed * 1.2)) % 360 + 360) % 360;
    }

    function rot(p) {
      let [x, y, z] = p;
      const cy = Math.cos(rotY), sy = Math.sin(rotY);
      const cxr = Math.cos(rotX), sx = Math.sin(rotX);
      let x1 = x * cy - z * sy;
      let z1 = x * sy + z * cy;
      let y1 = y * cxr - z1 * sx;
      let z2 = y * sx + z1 * cxr;
      return [x1, y1, z2];
    }
    function proj(p) {
      const [x, y, z] = rot(p);
      const f = zoom / (zoom + z * scale * 0.15 + scale);
      return { x: cx + x * scale * f, y: cy - y * scale * f, z, f };
    }
    function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function segCount() {
      if (N > 256) return 24;
      if (N > 128) return 36;
      if (N > 64) return 48;
      return 64;
    }
    function circlePts(u, rho, offset, seg) {
      const pts = [];
      let e2 = Math.abs(u[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
      let e1 = [u[1]*e2[2]-u[2]*e2[1], u[2]*e2[0]-u[0]*e2[2], u[0]*e2[1]-u[1]*e2[0]];
      let n1 = Math.hypot(e1[0], e1[1], e1[2]) || 1;
      e1 = [e1[0]/n1, e1[1]/n1, e1[2]/n1];
      e2 = [e1[1]*u[2]-e1[2]*u[1], e1[2]*u[0]-e1[0]*u[2], e1[0]*u[1]-e1[1]*u[0]];
      const cx0 = R * Math.cos(rho), rr = R * Math.sin(rho);
      for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        pts.push(proj([
          cx0*u[0] + rr*(ca*e1[0]+sa*e2[0]) + offset[0],
          cx0*u[1] + rr*(ca*e1[1]+sa*e2[1]) + offset[1],
          cx0*u[2] + rr*(ca*e1[2]+sa*e2[2]) + offset[2]
        ]));
      }
      return pts;
    }
    function strokePts(pts, color, width) {
      if (pts.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }
    function fillPts(pts, color) {
      if (pts.length < 3) return;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fill();
    }
    function drawDot(p, color, r) {
      const q = proj(p);
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(q.x, q.y, Math.max(1.0, r * q.f), 0, Math.PI * 2);
      ctx.fill();
    }
    function hsla(h, s, l, a) {
      return `hsla(${((h % 360) + 360) % 360} ${s}% ${l}% / ${a})`;
    }
    function animState(t) {
      t = ((t % 1) + 1) % 1;
      const signed = t < 0.5 ? (2 * t) : (2 * t - 2);
      return { rho: (Math.PI / 2) * Math.abs(signed), beta: (Math.PI / 2) * signed };
    }

    const t0 = performance.now();
    let lastNow = t0, simTime = 0;

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - lastNow) * 0.001);
      lastNow = now;
      if (!paused) simTime += dt;
      tickFlow(dt);
      const baseT = (simTime * rate) / CYCLE;
      if (autoSpin && !drag) rotY += 0.08 * dt;

      if (ghost > 0.001) {
        ctx.fillStyle = `rgba(5,5,12,${1 - ghost})`;
        ctx.fillRect(0, 0, W, H);
      } else {
        ctx.fillStyle = '#05050c';
        ctx.fillRect(0, 0, W, H);
      }

      if (starsOn) {
        for (const s of stars) {
          const q = proj(s);
          const a = 0.25 + 0.55 * ((s[0] * 13.7 + s[1] * 7.1) % 1 + 1) % 1;
          ctx.fillStyle = `rgba(220,230,255,${a})`;
          ctx.fillRect(q.x, q.y, 1.2, 1.2);
        }
      }

      const seg = segCount();
      const doGlow = glow && N <= 140;
      const doDots = showDots && N <= 180;
      const doTrails = flyMode && showTrails && N <= 64;
      if (showEq) strokePts(circlePts([0, 1, 0], Math.PI / 2, [0, 0, 0], 48), 'rgba(255,210,80,0.85)', 2);

      const hueNow = hue0 + simTime * hueSpd;
      const items = [];
      for (let k = 0; k < N; k++) {
        const stagger = N > 1 ? (phase * k) / N : 0;
        const { rho, beta } = animState(baseT + stagger);
        const lon = (2 * Math.PI * k) / N + simTime * drift + twist * beta;
        const cl = Math.cos(lon), sl = Math.sin(lon);
        const n = [Math.cos(beta) * cl, Math.sin(beta), Math.cos(beta) * sl];
        if (flyMode && !paused) {
          const spd = flyAmt * rate * (flyIn ? -1 : 1);
          flight[k][0] += n[0] * spd * dt;
          flight[k][1] += n[1] * spd * dt;
          flight[k][2] += n[2] * spd * dt;
        }
        const off = flyMode ? flight[k] : [0, 0, 0];
        const center = add([R * Math.cos(rho) * n[0], R * Math.cos(rho) * n[1], R * Math.cos(rho) * n[2]], off);
        items.push({ k, rho, n, off, center, T: [R * cl, 0, R * sl], cz: rot(center)[2] });
      }
      if (N <= 200) items.sort((a, b) => a.cz - b.cz);
      const wScale = N > 200 ? Math.max(0.45, 1.4 - N / 700) : 1;

      for (const it of items) {
        const { k, rho, n, off, center, T } = it;
        const h = hueNow + (k / Math.max(N, 1)) * 360;
        const pul = 1 + pulse * Math.sin(simTime * 3.2 + k * 0.4);
        const w = lineW * pul * wScale;
        const col = hsla(h, 90, 62, N > 200 ? 0.7 : 0.95);
        if (doTrails) {
          const tr = trails[k];
          tr.push(center.slice());
          if (tr.length > TRAIL_LEN) tr.shift();
          if (tr.length > 1) strokePts(tr.map(p => proj(p)), hsla(h, 80, 60, 0.35), 1.1);
        }
        if (rho > 1e-4) {
          const pts = circlePts(n, rho, off, seg);
          if (fillOn && fillAmt > 0 && N <= 140) fillPts(pts, hsla(h, 85, 55, fillAmt * pul));
          if (doGlow) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            strokePts(pts, hsla(h, 100, 60, 0.12), w * 5.5);
            strokePts(pts, hsla(h, 95, 70, 0.28), w * 2.4);
            ctx.restore();
          }
          strokePts(pts, col, w);
        }
        if (doDots) {
          drawDot(center, col, 3.4 * pul);
          if (N <= 80) drawDot(T, 'rgba(255,210,80,0.9)', 2.6);
        }
      }
    }
    frame(t0);
  </script>
</body>
</html>
