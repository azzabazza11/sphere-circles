<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05050c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sphere + Tangential Circles</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050c; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #info {
      position: fixed; left: 16px; top: 16px; color: #c8d0dc;
      font-family: system-ui, sans-serif; font-size: 12px; line-height: 1.5;
      pointer-events: none; text-shadow: 0 1px 6px #000;
    }
    #info span { color: #7fd4ff; }
    #panel {
      position: fixed; right: 14px; top: 14px; bottom: 14px; left: auto;
      width: 276px; max-width: calc(100vw - 28px);
      overflow-x: hidden; overflow-y: auto;
      z-index: 5;
      font-family: system-ui, sans-serif; color: #d0d6e0;
      background: rgba(8, 10, 18, 0.82);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 14px 18px; border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    #panel h1 { font-size: 13px; font-weight: 650; letter-spacing: 0.04em; color: #fff; margin: 0 0 8px; }
    #panel .acc { border-top: 1px solid rgba(255,255,255,0.08); }
    #panel .acc:first-of-type { border-top: none; }
    #panel .acc-h {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: transparent; border: 0; color: #7fd4ff; cursor: pointer;
      font: 650 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.12em;
      padding: 12px 0;
    }
    #panel .acc-h::after { content: '▸'; color: #668; }
    #panel .acc.open .acc-h::after { content: '▾'; }
    #panel .acc-b { display: none; padding-bottom: 6px; }
    #panel .acc.open .acc-b { display: block; }
    #panel label {
      display: grid; grid-template-columns: 72px 1fr 42px;
      align-items: center; gap: 8px; font-size: 12px; margin: 8px 0; min-height: 34px;
    }
    #panel input[type="range"] {
      width: 100%; height: 28px; accent-color: #44ffaa; cursor: pointer;
      -webkit-appearance: none; appearance: none; background: transparent;
    }
    #panel input[type="range"]::-webkit-slider-runnable-track {
      height: 10px; border-radius: 999px; background: rgba(255,255,255,0.14);
    }
    #panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 26px; height: 26px; margin-top: -8px;
      border-radius: 50%; background: #44ffaa; border: 2px solid #0a1a14;
    }
    #panel .val { color: #44ffaa; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }

    #panel .togs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
    #panel .tog {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: #8a93a3;
      border-radius: 999px;
      padding: 8px 12px;
      font: 650 11px system-ui, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    #panel .tog.on {
      color: #062218;
      background: #44ffaa;
      border-color: #6dffc0;
      box-shadow: 0 0 0 1px rgba(68,255,170,0.25), 0 0 16px rgba(68,255,170,0.28);
    }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
    .presets button {
      background: rgba(68,255,170,0.12); color: #c8ffe8;
      border: 1px solid rgba(68,255,170,0.35);
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .presets button:hover { background: rgba(68,255,170,0.22); }

    #qrModal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
      padding: 24px;
    }
    #qrModal.open { display: flex; }
    #qrCard {
      background: #10141e; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 18px 18px 14px; text-align: center;
      max-width: 300px; width: 100%;
      font-family: system-ui, sans-serif; color: #d0d6e0;
    }
    #qrCard img {
      width: 220px; height: 220px; border-radius: 10px; background: #fff;
      display: block; margin: 0 auto 12px;
    }
    #qrUrl {
      font-size: 11px; color: #8ab; word-break: break-all; margin-bottom: 12px; line-height: 1.35;
    }
    #qrCard .qr-actions { display: flex; gap: 8px; }
    #qrCard .qr-actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #qrClose { background: #44ffaa; color: #062218; }
    #qrCopy { background: rgba(255,255,255,0.1); color: #e8eef8; }

    #qrKofi {
      width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      background: #ff5e5b; color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    #qrHub {
      display: block; width: 100%; margin-top: 8px; border-radius: 10px; padding: 12px 8px;
      font: 650 13px system-ui, sans-serif; text-align: center; text-decoration: none;
      background: rgba(127,212,255,0.12); color: #7fd4ff;
      border: 1px solid rgba(127,212,255,0.28);
      -webkit-tap-highlight-color: transparent;
    }

    #installBtn {
      background: rgba(255,204,68,0.18); color: #ffe9a8;
      border: 1px solid rgba(255,204,68,0.4) !important;
    }
    #installBtn[hidden] { display: none !important; }
    #qrInstall {
      width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 12px 8px;
      font: 650 14px system-ui, sans-serif; cursor: pointer;
      background: rgba(255,204,68,0.2); color: #ffe9a8;
      border: 1px solid rgba(255,204,68,0.45);
      -webkit-tap-highlight-color: transparent;
    }
    #qrInstall[hidden] { display: none !important; }
    #toast {
      position: fixed; left: 50%; bottom: max(88px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30; max-width: min(92vw, 340px);
      padding: 12px 16px; border-radius: 12px;
      background: rgba(16,20,30,0.94); color: #e8eef8;
      border: 1px solid rgba(255,255,255,0.12);
      font: 600 13px system-ui, sans-serif; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    #toast.show { opacity: 1; }
    #hint { color: #889; font-size: 10px; margin-top: 10px; line-height: 1.4; }
    #quick {
      position: fixed; left: 16px; bottom: 16px; z-index: 3;
      display: flex; gap: 8px;
    }
    #quick button {
      min-width: 72px; padding: 10px 14px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8,10,18,0.78); color: #c8d0dc;
      font: 650 13px system-ui, sans-serif; cursor: pointer;
    }
    #quick button.on {
      color: #062218; background: #44ffaa; border-color: #44ffaa;
    }
  </style>
</head>
<body>
  <div id="info">
    drag orbit · scroll zoom · space pause · double-click reset cam<br>
    cycle <span id="rVal">0.00</span> · N <span id="nLive">16</span>
  </div>
  <div id="panel">
    <h1>Circles</h1>
    <div class="presets">
      <button data-preset="lattice">Lattice</button>
      <button data-preset="nebula">Nebula</button>
      <button data-preset="launch">Launch</button>
      <button data-preset="helix">Helix</button>
      <button data-preset="wire">Wire</button>
      <button data-preset="dense">Dense</button>
    </div>

    <div class="acc open" data-acc>
      <button type="button" class="acc-h">Motion</button>
      <div class="acc-b">
        <label>Circles <input id="count" type="range" min="1" max="108" step="1" value="16"><span class="val" id="countVal">16</span></label>
        <label>Phase <input id="phase" type="range" min="0" max="1" step="0.001" value="0.35"><span class="val" id="phaseVal">0.35</span></label>
        <label>Rate <input id="rate" type="range" min="0.05" max="4" step="0.01" value="1"><span class="val" id="rateVal">1.00×</span></label>
        <label>Twist <input id="twist" type="range" min="0" max="4" step="0.01" value="0"><span class="val" id="twistVal">0.00</span></label>
        <label>Drift <input id="drift" type="range" min="0" max="2" step="0.01" value="0"><span class="val" id="driftVal">0.00</span></label>
        <div class="togs">
          <button type="button" class="tog" id="autoFlow" aria-pressed="false">Auto flow</button>
          <button type="button" class="tog" id="pause" aria-pressed="false">Pause</button>
        </div>
        <label>Flow spd <input id="flowSpd" type="range" min="0.15" max="2" step="0.01" value="0.55"><span class="val" id="flowSpdVal">0.55</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Fly</button>
      <div class="acc-b">
        <div class="togs">
          <button type="button" class="tog" id="flyMode" aria-pressed="false">Fly</button>
          <button type="button" class="tog" id="flyVel" aria-pressed="false">Vel by R</button>
          <button type="button" class="tog" id="flyIn" aria-pressed="false">Inward</button>
          <button type="button" class="tog" id="flyMirror" aria-pressed="false">Mirror</button>
          <button type="button" class="tog on" id="showTrails" aria-pressed="true">Trails</button>
        </div>
        <label>Altitude <input id="flyAlt" type="range" min="0" max="3.5" step="0.01" value="1.25"><span class="val" id="flyAltVal">1.25</span></label>
      </div>
    </div>
    <div class="acc" data-acc>
      <button type="button" class="acc-h">Look</button>
      <div class="acc-b">
        <div class="togs">
          <button type="button" class="tog" id="showSphere" aria-pressed="false">Sphere</button>
          <button type="button" class="tog on" id="showEq" aria-pressed="true">Equator</button>
          <button type="button" class="tog on" id="showDots" aria-pressed="true">Dots</button>
          <button type="button" class="tog" id="showNrm" aria-pressed="false">Normals</button>
          <button type="button" class="tog on" id="glow" aria-pressed="true">Glow</button>
          <button type="button" class="tog" id="fillOn" aria-pressed="false">Fill</button>
          <button type="button" class="tog on" id="starsOn" aria-pressed="true">Stars</button>
          <button type="button" class="tog" id="pondOn" aria-pressed="false">Pond</button>
          <button type="button" class="tog on" id="autoSpin" aria-pressed="true">Orbit</button>
        </div>
        <label>Width <input id="width" type="range" min="0.4" max="5" step="0.05" value="1.6"><span class="val" id="widthVal">1.60</span></label>
        <label>Hue <input id="hue" type="range" min="0" max="360" step="1" value="0"><span class="val" id="hueVal">0</span></label>
        <label>Hue spd <input id="hueSpd" type="range" min="0" max="80" step="0.5" value="8"><span class="val" id="hueSpdVal">8.0</span></label>
        <label>Pulse <input id="pulse" type="range" min="0" max="1" step="0.01" value="0.25"><span class="val" id="pulseVal">0.25</span></label>
        <label>Ghost <input id="ghost" type="range" min="0" max="0.92" step="0.01" value="0.18"><span class="val" id="ghostVal">0.18</span></label>
        <label>Fill amt <input id="fillAmt" type="range" min="0" max="0.35" step="0.005" value="0.06"><span class="val" id="fillAmtVal">0.06</span></label>
      </div>
    </div>
    <div class="actions" style="display:flex;gap:8px;margin-top:12px">
      <button id="shareBtn" type="button" style="flex:1;border:1px solid rgba(127,212,255,0.35);border-radius:10px;padding:12px 8px;background:rgba(127,212,255,0.18);color:#cfefff;font:650 13px system-ui,sans-serif;cursor:pointer">Share QR</button>
      <button id="installBtn" type="button" style="flex:1;border:1px solid rgba(255,204,68,0.4);border-radius:10px;padding:12px 8px;background:rgba(255,204,68,0.18);color:#ffe9a8;font:650 13px system-ui,sans-serif;cursor:pointer">Install</button>
    </div>
    <p id="hint">Auto flow wanders 1–3 controls on its own (varying rates & holds). Concertina sections · fat sliders.</p>
  </div>
  <div id="quick">
    <button type="button" id="quickFly">Fly</button>
    <button type="button" id="quickFlow">Flow</button>
  </div>
  
  <div id="qrModal">
    <div id="qrCard">
      <img id="qrImg" width="220" height="220" alt="Share QR">
      <div id="qrUrl"></div>
      <div class="qr-actions">
        <button type="button" id="qrCopy">Copy link</button>
        <button type="button" id="qrClose">Close</button>
      </div>
      <button type="button" id="qrInstall">Install app</button>
      <button type="button" id="qrKofi">Support on Ko-fi</button>
      <a id="qrHub" href="https://azzabazza11.github.io/" target="_blank" rel="noopener noreferrer">More apps →</a>
    </div>
  </div>

  <div id="toast"></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const R = 1;
    const CYCLE = 6;
    const MAX_N = 108;
    const TRAIL_LEN = 70;

    const $ = (id) => document.getElementById(id);
    const bindRange = (id, valId, parse, fmt, apply) => {
      const el = $(id), out = $(valId);
      const go = () => { const v = parse(el.value); out.textContent = fmt(v); apply(v); };
      el.addEventListener('input', go); go(); return el;
    };

    function isOn(el) { return !!(el && el.classList.contains('on')); }
    function setOn(el, on) {
      if (!el) return;
      el.classList.toggle('on', !!on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    const bindCheck = (id, apply) => {
      const el = $(id); if (!el) return el;
      const go = () => apply(isOn(el));
      el.addEventListener('click', e => {
        e.preventDefault();
        setOn(el, !isOn(el));
        el.dispatchEvent(new Event('change'));
      });
      el.addEventListener('change', go); go(); return el;
    };

    let N = 16, phase = 0.35, rate = 1, twist = 0, drift = 0, paused = false;
    let flyMode = false, flyAlt = 1.25, flyIn = false, flyVel = false, flyMirror = false, showTrails = true;
    let flyBlend = 0;
    let showSphere = false, showEq = true, showDots = true, showNrm = false;
    let glow = true, fillOn = false, starsOn = true, pondOn = false, autoSpin = true;
    let pondFrac = 0.2, pondDragging = false;
    try {
      const pf = parseFloat(localStorage.getItem('circles_pond_frac'));
      if (Number.isFinite(pf)) pondFrac = pf;
    } catch (e) {}
    let lineW = 1.6, hue0 = 0, hueSpd = 8, pulse = 0.25, ghost = 0.18, fillAmt = 0.06;
    let autoFlow = false, flowSpd = 0.55, flowMuteUI = false;
    let controlsReady = false;

    const trails = Array.from({ length: MAX_N }, () => []);
    function clearTrails() { for (let i = 0; i < MAX_N; i++) trails[i].length = 0; }

    function animState(t) {
      t = ((t % 1) + 1) % 1;
      const signed = t < 0.5 ? (2 * t) : (2 * t - 2);
      const rho = (Math.PI / 2) * Math.abs(signed);
      const beta = (Math.PI / 2) * signed;
      return { t, rho, beta };
    }



    // Fly: unit-normalized integral of the tilting plane normal, scaled by Altitude.
    // Paths return each cycle. Mirror sends odd circles on the reflected meridian path.
    // Bloom flares them farther when open; a soft helix swirl peels them into space.
    // flyBlend eases everyone back onto the sphere when Fly is turned off.
    var flyTable = [[0, 0]];
    var flyEnd = [0, 0];
    var flyNorm = 1;
    function rebuildFlyTable() {
      const n = 512;
      const tab = [[0, 0]];
      let x = 0, y = 0;
      for (let i = 1; i <= n; i++) {
        const t0 = (i - 1) / n;
        const t1 = i / n;
        const st = animState(t0);
        const nx = Math.cos(st.beta), ny = Math.sin(st.beta);
        let w = 1;
        if (flyVel) w = 0.18 + 0.82 * Math.sin(st.rho);
        const ds = (t1 - t0) * CYCLE;
        x += nx * w * ds;
        y += ny * w * ds;
        tab.push([x, y]);
      }
      flyTable = tab;
      flyEnd = [x, y];
      let maxR = 1e-6;
      for (let i = 0; i <= n; i++) {
        const tt = i / n;
        const cx = tab[i][0] - tt * x;
        const cy = tab[i][1] - tt * y;
        maxR = Math.max(maxR, Math.hypot(cx, cy));
      }
      flyNorm = maxR;
    }
    function sampleFlyLocal(t) {
      t = ((t % 1) + 1) % 1;
      const n = flyTable.length - 1;
      const idx = t * n;
      const i0 = Math.floor(idx);
      const i1 = Math.min(n, i0 + 1);
      const u = idx - i0;
      const a = flyTable[i0], b = flyTable[i1];
      const lx = (a[0] + (b[0] - a[0]) * u - t * flyEnd[0]) / flyNorm;
      const ly = (a[1] + (b[1] - a[1]) * u - t * flyEnd[1]) / flyNorm;
      return [lx, ly, 0];
    }
    function rotateY(v, lon) {
      const c = Math.cos(lon), s = Math.sin(lon);
      return [v[0] * c, v[1], -v[0] * s];
    }
    function flyOffset(t, lon, k) {
      if (flyBlend < 1e-4 || flyAlt <= 1e-6) return [0, 0, 0];
      const st = animState(t);
      let local = sampleFlyLocal(t);
      const mirrored = flyMirror && ((k | 0) & 1);
      if (mirrored) {
        // Reflect across the equator in the meridian plane + opposite radial peel
        local = [-local[0], -local[1], 0];
      }
      // Open circles climb farther; tiny ones stay nearer the sphere
      const bloom = 1 + 0.55 * Math.sin(st.rho);
      const s = flyAlt * bloom * (flyIn ? -1 : 1) * flyBlend;
      let lx = local[0] * s;
      let ly = local[1] * s;
      // Soft helix: swirl around the flight axis as they climb
      const swirl = flyAlt * 0.28 * flyBlend * Math.sin(st.rho) * Math.sin(2 * Math.PI * t + (mirrored ? Math.PI : 0));
      const xz = Math.hypot(lx, 0.0001);
      const hx = lx - swirl * (ly * 0.35);
      const hy = ly + swirl * (xz * 0.55);
      const hz = swirl * (mirrored ? -1 : 1) * 0.65;
      return rotateY([hx, hy, hz], lon);
    }
    rebuildFlyTable();



    function setSlider(id, value, silent) {
      const el = $(id); el.value = value;
      flowMuteUI = !!silent;
      el.dispatchEvent(new Event('input'));
      if (!silent) el.dispatchEvent(new Event('change'));
      flowMuteUI = false;
    }
    function setCheck(id, on, silent) {
      const el = $(id); setOn(el, on);
      flowMuteUI = !!silent;
      el.dispatchEvent(new Event('change'));
      flowMuteUI = false;
    }

    bindRange('count', 'countVal', parseInt, v => v, v => N = v);
    bindRange('phase', 'phaseVal', parseFloat, v => v.toFixed(2), v => phase = v);
    bindRange('rate', 'rateVal', parseFloat, v => v.toFixed(2) + '×', v => rate = v);
    bindRange('twist', 'twistVal', parseFloat, v => v.toFixed(2), v => twist = v);
    bindRange('drift', 'driftVal', parseFloat, v => v.toFixed(2), v => drift = v);
    bindRange('flowSpd', 'flowSpdVal', parseFloat, v => v.toFixed(2), v => flowSpd = v);
    bindCheck('pause', v => paused = v);

    function syncQuick() {
      const qf = $('quickFly'), qo = $('quickFlow');
      if (qf) qf.classList.toggle('on', !!flyMode);
      if (qo) qo.classList.toggle('on', !!autoFlow);
    }
    function toggleCheck(id, on) {
      const el = $(id); if (!el) return;
      setOn(el, !!on); el.dispatchEvent(new Event('change')); syncQuick();
    }
    if ($('quickFly')) {
      $('quickFly').addEventListener('click', () => toggleCheck('flyMode', !isOn($('flyMode'))));
      $('quickFlow').addEventListener('click', () => toggleCheck('autoFlow', !isOn($('autoFlow'))));
    }
    bindCheck('autoFlow', v => { autoFlow = v; if (v && controlsReady && !flowMuteUI) pickFlowSlider(); syncQuick(); });
    bindCheck('flyMode', v => { flyMode = v; if (!flowMuteUI) clearTrails(); syncQuick(); });
    bindRange('flyAlt', 'flyAltVal', parseFloat, v => v.toFixed(2), v => flyAlt = v);
    bindCheck('flyVel', v => { flyVel = v; if (controlsReady) { rebuildFlyTable(); clearTrails(); } });
    bindCheck('flyIn', v => flyIn = v);
    bindCheck('flyMirror', v => { flyMirror = v; if (controlsReady) clearTrails(); });
    bindCheck('showTrails', v => showTrails = v);
    bindCheck('showSphere', v => showSphere = v);
    bindCheck('showEq', v => showEq = v);
    bindCheck('showDots', v => showDots = v);
    bindCheck('showNrm', v => showNrm = v);
    bindCheck('glow', v => glow = v);
    bindCheck('fillOn', v => fillOn = v);
    bindCheck('starsOn', v => starsOn = v);
    bindCheck('pondOn', v => {
      pondOn = v;
      if (v) pondFrac = clampPondFrac(pondFrac);
    });
    bindCheck('autoSpin', v => autoSpin = v);
    bindRange('width', 'widthVal', parseFloat, v => v.toFixed(2), v => lineW = v);
    bindRange('hue', 'hueVal', parseFloat, v => String(Math.round(v)), v => hue0 = v);
    bindRange('hueSpd', 'hueSpdVal', parseFloat, v => v.toFixed(1), v => hueSpd = v);
    bindRange('pulse', 'pulseVal', parseFloat, v => v.toFixed(2), v => pulse = v);
    bindRange('ghost', 'ghostVal', parseFloat, v => v.toFixed(2), v => ghost = v);
    bindRange('fillAmt', 'fillAmtVal', parseFloat, v => v.toFixed(2), v => fillAmt = v);

    const presets = {
      lattice: () => {
        setSlider('count', 24); setSlider('phase', 0); setSlider('rate', 1);

    function rnd(a, b) { return a + Math.random() * (b - a); }
    const FLOW_SLIDERS = [
      { key:'N', min:1, max:108, int:true, get:()=>N, set:v=>{ N=Math.round(v); setSlider('count', N, true); } },
      { key:'phase', min:0, max:1, get:()=>phase, set:v=>{ phase=v; setSlider('phase', v, true); } },

      { key:'drift', min:0, max:2, get:()=>drift, set:v=>{ drift=v; setSlider('drift', v, true); } },

    ];
    let flowVoices = [];
    let flowSceneHold = 0;
    let flowTargetVoices = 1;

    function makeFlowVoice(avoidKeys) {
      const pool = FLOW_SLIDERS.filter(s => !avoidKeys.has(s.key));
      const s = (pool.length ? pool : FLOW_SLIDERS)[Math.floor(Math.random() * (pool.length || FLOW_SLIDERS.length))];
      let spd;
      const roll = Math.random();
      if (roll < 0.08) spd = 0;
      else if (roll < 0.28) spd = rnd(0.12, 0.4);
      else if (roll < 0.82) spd = rnd(0.55, 1.6);
      else spd = rnd(2.0, 4.2);
      return {
        key: s.key,
        dir: Math.random() < 0.5 ? -1 : 1,
        spd,
        hold: spd === 0 ? rnd(1.2, 4.5) : rnd(2.0, 18)
      };
    }
    function refreshFlowScene() {
      const r = Math.random();

      flowSceneHold = rnd(7, 26);
    }
    function pickFlowSlider() {
      refreshFlowScene();
      flowVoices = [];
      const avoid = new Set();
      for (let i = 0; i < flowTargetVoices; i++) {
        const v = makeFlowVoice(avoid);
        avoid.add(v.key);
        flowVoices.push(v);
      }
    }
    function tickFlow(dt) {
      if (!autoFlow || paused) return;
      if (!flowVoices.length) pickFlowSlider();
      flowSceneHold -= dt;
      if (flowSceneHold <= 0) {
        refreshFlowScene();
        while (flowVoices.length > flowTargetVoices) flowVoices.pop();
        const avoid = new Set(flowVoices.map(v => v.key));
        while (flowVoices.length < flowTargetVoices) {
          const v = makeFlowVoice(avoid);
          avoid.add(v.key);
          flowVoices.push(v);
        }
        if (flowVoices.length && Math.random() < 0.45) {
          const i = Math.floor(Math.random() * flowVoices.length);
          avoid.delete(flowVoices[i].key);
          const v = makeFlowVoice(avoid);
          flowVoices[i] = v;
        }
      }
      for (const voice of flowVoices) {
        voice.hold -= dt;
        if (voice.hold <= 0) {
          const avoid = new Set(flowVoices.map(v => v.key));
          avoid.delete(voice.key);
          const next = makeFlowVoice(avoid);
          voice.key = next.key; voice.dir = next.dir; voice.spd = next.spd; voice.hold = next.hold;
        }
        if (voice.spd <= 1e-6) continue;
        const s = FLOW_SLIDERS.find(x => x.key === voice.key);
        if (!s) continue;
        const span = Math.max(1e-6, s.max - s.min);
        let next = s.get() + voice.dir * span * (0.03 * flowSpd * voice.spd) * dt;
        if (next >= s.max) { next = s.max; voice.dir = -1; }
        if (next <= s.min) { next = s.min; voice.dir = 1; }

    let W, H, cx, cy, scale;

    function pondClearancePx() {

    }
    function clampPondFrac(f) {

    function horizonY() { return H - H * clampPondFrac(pondFrac); }
    function savePondFrac() {

    const ZOOM_MIN = 50, ZOOM_MAX = 16000, ZOOM_REF = 300;

    const stars = Array.from({ length: 180 }, () => [(Math.random()-0.5)*28,(Math.random()-0.5)*28,(Math.random()-0.5)*28]);
    function rot(p) {
      let [x, y, z] = p;
      const cy = Math.cos(rotY), sy = Math.sin(rotY);

    function add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
    function segCount() {

    }
    function circlePts(u, rho, offset, seg) {
      const pts = [];
      let e2 = Math.abs(u[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
      let e1 = [u[1]*e2[2]-u[2]*e2[1], u[2]*e2[0]-u[0]*e2[2], u[0]*e2[1]-u[1]*e2[0]];
      let n1 = Math.hypot(e1[0], e1[1], e1[2]) || 1;

          cx0*u[1] + rr*(ca*e1[1]+sa*e2[1]) + offset[1],
          cx0*u[2] + rr*(ca*e1[2]+sa*e2[2]) + offset[2]

    }
    function strokePts(pts, color, width) {

    function hsla(h, s, l, a) { return `hsla(${((h%360)+360)%360} ${s}% ${l}% / ${a})`; }
    function sphereWire() {
      const seg = 48;

        const phi = (lat / 4) * Math.PI * 0.5, y0 = Math.sin(phi)*R, r0 = Math.cos(phi)*R;

    const rVal = $('rVal'), nLive = $('nLive');
    const t0 = performance.now();
    let lastNow = t0, simTime = 0;

    function frame(now) {

      const dt = Math.min(0.05, (now - lastNow) * 0.001);
      lastNow = now;
      if (!paused) simTime += dt;
      tickFlow(dt);
      const flyTarget = flyMode ? 1 : 0;
      flyBlend += (flyTarget - flyBlend) * Math.min(1, dt * 2.2);
      if (Math.abs(flyBlend - flyTarget) < 0.001) flyBlend = flyTarget;
      const baseT = (simTime * rate) / CYCLE;
      rVal.textContent = baseT.toFixed(2);
      nLive.textContent = String(N);
      if (autoSpin && !drag) rotY += 0.12 * dt;

      if (ghost > 0.001) { ctx.fillStyle = `rgba(5,5,12,${1 - ghost})`; ctx.fillRect(0, 0, W, H); }
      else { ctx.fillStyle = '#05050c'; ctx.fillRect(0, 0, W, H); }

      const doDots = showDots && N <= 220;

      if (showSphere && N <= 128) sphereWire();
      if (showEq) strokePts(circlePts([0,1,0], Math.PI/2, [0,0,0], 64), 'rgba(255,210,80,0.85)', 2);

      for (let k = 0; k < N; k++) {
        const stagger = N > 1 ? (phase * k) / N : 0;

        const cl = Math.cos(lon), sl = Math.sin(lon);
        const n = [Math.cos(beta)*cl, Math.sin(beta), Math.cos(beta)*sl];
        const off = flyOffset(tk, lon, k);
        const surfCenter = [R*Math.cos(rho)*n[0], R*Math.cos(rho)*n[1], R*Math.cos(rho)*n[2]];

        const pul = 1 + pulse * Math.sin(simTime * 3.2 + k * 0.4);
        const w = lineW * pul * wScale;
        const col = hsla(h, 90, 62, N > 200 ? 0.7 : 0.95);
        if (doTrails) {

        }

        const url = shareUrl();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(url);
          else {
            const ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
          }
          $('qrCopy').textContent = 'Copied';
          setTimeout(() => { $('qrCopy').textContent = 'Copy link'; }, 1200);
        } catch (err) {
          $('qrCopy').textContent = 'Copy failed';
          setTimeout(() => { $('qrCopy').textContent = 'Copy link'; }, 1200);
        }
      });
    }
    if ($('qrModal')) {
      $('qrModal').addEventListener('click', e => {
        if (e.target === $('qrModal')) closeQr();
      });
    }

    const SUPPORT_URL = 'https://ko-fi.com/aaroncallinan';
    if ($('qrKofi')) {
      $('qrKofi').addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        if (SUPPORT_URL) window.open(SUPPORT_URL, '_blank', 'noopener,noreferrer');
      });
    }


    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=' + APP_VER).catch(() => {});
    }

    const INSTALL_HINT_IOS = 'On iPhone: tap Share, then Add to Home Screen.';
    let deferredInstallPrompt = null;
    function isStandaloneDisplay() {
      return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    }
    function isIosLike() {
      const ua = navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    function showToast(msg) {
      const el = $('toast');
      if (!el) { try { alert(msg); } catch (e) {} return; }
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
    }
    function updateInstallButton() {
      const btns = [$('installBtn'), $('qrInstall')].filter(Boolean);
      if (!btns.length) return;
      if (isStandaloneDisplay()) {
        btns.forEach(b => { b.hidden = true; });
        return;
      }
      btns.forEach(b => {
        b.hidden = false;
        b.textContent = deferredInstallPrompt ? 'Install app' : (isIosLike() ? 'Add to Home Screen' : 'Install app');
      });
    }
    async function promptInstallApp() {
      if (isStandaloneDisplay()) {
        showToast('Already installed');
        return;
      }
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        try { await deferredInstallPrompt.userChoice; } catch (e) {}
        deferredInstallPrompt = null;
        updateInstallButton();
        return;
      }
      showToast(isIosLike() ? INSTALL_HINT_IOS : 'Use your browser menu → Install app / Add to Home screen');
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      updateInstallButton();
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      updateInstallButton();
      showToast('Installed');
    });
    if ($('installBtn')) $('installBtn').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      promptInstallApp();
    });
    if ($('qrInstall')) $('qrInstall').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      promptInstallApp();
    });
    updateInstallButton();

  </script>
</body>
</html>
